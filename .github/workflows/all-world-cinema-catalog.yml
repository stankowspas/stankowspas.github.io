name: All-World Cinema catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    paths:
      - 'projects/all-world-cinema/app/tools/build-catalog.mjs'
      - '.github/workflows/all-world-cinema-catalog.yml'

permissions:
  contents: write

concurrency:
  group: all-world-cinema-catalog
  cancel-in-progress: true

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build lightweight catalog
        run: node projects/all-world-cinema/app/tools/build-catalog.mjs
      - name: Validate catalog
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'projects/all-world-cinema/app/catalog.json';
          const d = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (d.version !== 3 || !Array.isArray(d.movie) || !Array.isArray(d.series)) process.exit(1);
          if ((d.movie.length + d.series.length) < 100) process.exit(2);
          console.log(d.counts);
          NODE
      - name: Commit catalog if changed
        run: |
          if git diff --quiet -- projects/all-world-cinema/app/catalog.json; then
            echo 'Catalog unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/all-world-cinema/app/catalog.json
          git commit -m 'Update All-World Cinema catalog'
          git push
