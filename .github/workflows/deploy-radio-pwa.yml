name: Deploy Radio PWA

on:
  push:
    branches: [main]
    paths:
      - '.radio-pwa/payload.zip'
      - '.github/workflows/deploy-radio-pwa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-radio-pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand Radio PWA into GitHub Pages path
        shell: bash
        run: |
          set -euo pipefail
          rm -rf projects/radio
          mkdir -p projects/radio
          unzip -q -o .radio-pwa/payload.zip -d projects/radio
          test -f projects/radio/index.html
          test -f projects/radio/manifest.webmanifest
          test -f projects/radio/sw.js
          ! grep -R "onrender.com" projects/radio

      - name: Commit deployed PWA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/radio
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Deploy Radio PWA directly on GitHub Pages"
          git push
