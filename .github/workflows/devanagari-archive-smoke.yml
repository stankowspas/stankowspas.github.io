                  dl=await event.value
                  assert pathlib.Path(await dl.path()).read_bytes()==b"OLD ARCHIVE 2015: real file bytes \x00\x01\xff"
                  print("OLD 2015 ZIP: automatic preview and downloaded original bytes PASS")
                  # Correctly detect ZIP by signature even if the filename does not end with .zip
                  await choose("legacy-data.bin",1)
                  assert "document-2015.txt" in await page.locator("#arcContent").inner_text()
                  print("OLD ZIP without .zip suffix: detected PASS")
                  # Two files should produce two individual download links, not another ZIP.
                  await choose("old-many.zip",2)
                  if await page.locator("#arcToFolder").is_checked():await page.locator("#arcToFolder").uncheck()
                  await page.locator("#arcExtract").click()
                  await page.wait_for_function("() => document.querySelectorAll('#arcManualDownloads a').length===2",timeout=15000)
                  assert "folder/one.txt" in await page.locator("#arcManualDownloads").inner_text()
                  async with page.expect_download() as event:
                      await page.locator("#arcManualDownloads a").first.click()
                  assert pathlib.Path(await (await event.value).path()).read_bytes()==b"OLD-ONE"
                  print("OLD multi-file ZIP: independently downloadable extracted files PASS")
                  # Typical ZIP64 local header with data descriptor support.
                  await choose("old-force-zip64.zip",1)
                  async with page.expect_download() as event:
                      await page.locator("#arcExtract").click()
                  assert pathlib.Path(await (await event.value).path()).read_bytes()==b"ZIP64-OK"
                  print("OLD ZIP64 file: extracted PASS")
                  # Existing encrypted ZIP produced by a separate application.
                  await page.locator("#arcPassword").fill("")
                  await page.locator("#arcSource").set_input_files(root/"old-aes.zip")
                  await page.wait_for_function("() => document.querySelector('#arcStatus').classList.contains('archive-error')",timeout=15000)
                  assert "парола" in (await page.locator("#arcStatus").inner_text()).lower()
