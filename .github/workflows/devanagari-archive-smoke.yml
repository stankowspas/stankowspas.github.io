name: Devanagari archive mode smoke test
on:
  push:
    branches: [draft/devanagari-cryptor-4.3.9-archive]
  workflow_dispatch:
jobs:
  browser-archive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test driver
        run: |
          python3 -m venv /tmp/dc-playwright
          /tmp/dc-playwright/bin/python -m pip install -q playwright==1.56.0
      - name: Run real Chrome archive creation and restoration tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory projects/devanagari-cryptor >/tmp/archiver-http.log 2>&1 &
          sleep 2
          /tmp/dc-playwright/bin/python - <<'PY'
          import asyncio, shutil
          from playwright.async_api import async_playwright
          async def main():
              executable = shutil.which("google-chrome") or shutil.which("chromium") or shutil.which("chromium-browser")
              if not executable:
                  raise RuntimeError("Chrome is missing")
              async with async_playwright() as playwright:
                  browser = await playwright.chromium.launch(headless=True, executable_path=executable, args=["--no-sandbox", "--disable-dev-shm-usage"])
                  page = await browser.new_page(viewport={"width": 1280, "height": 1000})
                  page.on("pageerror", lambda error: print("PAGE ERROR:", error))
                  await page.goto("http://127.0.0.1:8765/archive-smoke.html")
                  await page.wait_for_function("""() => {
                    const text=document.querySelector('#result')?.textContent||'';
                    return text.startsWith('PASS:')||text.startsWith('FAIL:');
                  }""", timeout=65000)
                  result = await page.locator("#result").inner_text()
                  print("BROWSER RESULT:",result)
                  await browser.close()
                  if not result.startswith("PASS: four tabs"):
                      raise RuntimeError("Archive browser roundtrip or UI test failed: "+result)
          asyncio.run(main())
          PY
      - name: Test exact downloadable package with local file URL
        shell: bash
        run: |
          set -euo pipefail
          /tmp/dc-playwright/bin/python - <<'PY'
          import asyncio, pathlib, shutil, tempfile, zipfile
          from playwright.async_api import async_playwright
          package = pathlib.Path("projects/devanagari-cryptor/Devanagari_Cryptor_4.3.11_START.zip")
          with zipfile.ZipFile(package) as z:
              names = set(z.namelist())
              assert "Devanagari-Cryptor-4.3.11.html" in names, names
              assert "START_HERE_BG.txt" in names, names
              bad = z.testzip()
              assert bad is None, f"CRC check failed: {bad}"
              with tempfile.TemporaryDirectory() as folder:
                  z.extractall(folder)
                  path=pathlib.Path(folder,"Devanagari-Cryptor-4.3.11.html")
                  async def test():
                      async with async_playwright() as playwright:
                          exe=shutil.which("google-chrome") or shutil.which("chromium")
                          browser=await playwright.chromium.launch(headless=True,executable_path=exe,args=["--no-sandbox"])
                          page=await browser.new_page()
                          errors=[]
                          page.on("pageerror",lambda e:errors.append(str(e)))
                          await page.goto(path.as_uri(),wait_until="load")
                          result=await page.evaluate("""async () => {
                            const tabs=document.querySelectorAll('.mode-tab');
                            const core=window.DC_ARCHIVE_CORE;
                            if(tabs.length!==4||!core)throw Error('App not fully loaded');
                            document.querySelector('[data-mode="archive"]').click();
                            if(document.querySelector('#archiveSection').hidden)throw Error('Archive tab did not open');
                            const f=new File(['Offline проверка'],'български.txt',{type:'text/plain'});
                            const zipped=await core.zipWrite([{file:f,pathname:f.name}],"file-test.zip");
                            const parsed=await core.zipOpen(zipped);
                            const restored=await parsed.entries[0].extract();
                            if(await restored.text()!=='Offline проверка')throw Error('ZIP byte roundtrip failed');
                            return {version:document.querySelector('.app-ver').textContent,tabs:tabs.length,size:zipped.size,original:await restored.text()};
                          }""")
                          print("FILE LOCAL TEST: PASS",result)
                          print("Browser errors:",errors)
                          if errors:raise RuntimeError("Browser JS error: "+str(errors))
                          await browser.close()
                  asyncio.run(test())
          PY
      - name: Test 4.3.12 ZIP and AES password support in Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile, pathlib
          p=pathlib.Path("projects/devanagari-cryptor/archive-external-fixture.zip")
          with zipfile.ZipFile(p,"w") as z:
              z.writestr("folder/from-python.txt","External ZIP compatibility: Проверка 123",compress_type=zipfile.ZIP_DEFLATED)
              z.writestr("binary.dat",bytes([0,1,2,255,99]),compress_type=zipfile.ZIP_STORED)
          print("EXTERNAL ZIP:",p.stat().st_size)
          PY
          /tmp/dc-playwright/bin/python - <<'PY'
          import asyncio, shutil
          from playwright.async_api import async_playwright
          async def main():
              exe=shutil.which("google-chrome") or shutil.which("chromium")
              async with async_playwright() as playwright:
                  browser=await playwright.chromium.launch(headless=True,executable_path=exe,args=["--no-sandbox","--disable-dev-shm-usage"])
                  page=await browser.new_page(viewport={"width":1280,"height":1000})
                  errors=[]
                  page.on("pageerror",lambda e: errors.append(str(e)))
                  await page.goto("http://127.0.0.1:8765/archive-smoke-4.3.12.html")
                  await page.wait_for_function("""() => {
                    const v=document.querySelector("#result")?.textContent||"";
                    return v.startsWith("PASS:")||v.startsWith("FAIL:");
                  }""", timeout=90000)
                  result=await page.locator("#result").inner_text()
                  print("AES-256 BROWSER TEST:",result)
                  print("JS ERRORS:",errors)
                  await browser.close()
                  if not result.startswith("PASS:"):
                      raise AssertionError(result)
                  if errors:
                      raise AssertionError("JavaScript errors: "+str(errors))
          asyncio.run(main())
          PY
      - name: Cross-check AES-256 ZIP compatibility against independent Python implementation
        shell: bash
        run: |
          set -euo pipefail
          /tmp/dc-playwright/bin/python -m pip install -q pyzipper==0.3.6
          /tmp/dc-playwright/bin/python - <<'PY'
          import asyncio, base64, io, shutil, zipfile
          import pyzipper
          from playwright.async_api import async_playwright
          password = "Independent_AES256_123"
          text = "AES interoperability. Български. देवनागरी."
          async def main():
              exe=shutil.which("google-chrome") or shutil.which("chromium")
              async with async_playwright() as pw:
                  browser=await pw.chromium.launch(executable_path=exe,headless=True,args=["--no-sandbox"])
                  page=await browser.new_page()
                  await page.goto("http://127.0.0.1:8765/app-4.3.12-standalone.html")
                  created=await page.evaluate("""async ({password,text}) => {
                    const file=new File([new TextEncoder().encode(text)],"документ.txt");
                    const output=await DC_ARCHIVE_CORE.zipWrite([{file,pathname:"папка/документ.txt"}],"encrypted.zip",password);
                    return new Promise((resolve,reject)=>{
                      const reader=new FileReader();
                      reader.onload=()=>resolve(reader.result.split(",")[1]);
                      reader.onerror=()=>reject(reader.error);
                      reader.readAsDataURL(output);
                    });
                  }""",{"password":password,"text":text})
                  with pyzipper.AESZipFile(io.BytesIO(base64.b64decode(created)),"r") as archive:
                      archive.setpassword(password.encode())
                      verified=archive.read("папка/документ.txt").decode("utf-8")
                      assert verified==text
                  print("INDEPENDENT AES DECRYPT: PASS")
                  external=io.BytesIO()
                  with pyzipper.AESZipFile(external,"w",compression=zipfile.ZIP_DEFLATED,encryption=pyzipper.WZ_AES) as archive:
                      archive.setpassword(password.encode())
                      archive.setencryption(pyzipper.WZ_AES,nbits=256)
                      archive.writestr("external.txt",text.encode("utf-8"))
                  encoded=base64.b64encode(external.getvalue()).decode()
                  output=await page.evaluate("""async ({encoded,password}) => {
                    const b=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
                    const file=new File([b],"external.zip");
                    const arc=await DC_ARCHIVE_CORE.zipOpen(file,password);
                    const result=await arc.entries[0].extract();
                    await arc.close();
                    return await result.text();
                  }""",{"encoded":encoded,"password":password})
                  assert output==text
                  print("INDEPENDENT AES ENCRYPT / APP DECRYPT: PASS")
                  await browser.close()
          asyncio.run(main())
          PY
      - name: Test exact 4.3.12 downloadable ZIP package opened from disk without a server
        shell: bash
        run: |
          set -euo pipefail
          /tmp/dc-playwright/bin/python - <<'PY'
          import asyncio, pathlib, shutil, tempfile, zipfile
          from playwright.async_api import async_playwright
          package=pathlib.Path("projects/devanagari-cryptor/Devanagari_Cryptor_4.3.12_AES_TESTED.zip")
          with zipfile.ZipFile(package) as z:
              assert z.testzip() is None,"ZIP CRC verification failed"
              assert "Devanagari-Cryptor-4.3.12.html" in z.namelist()
              assert "START_HERE_BG.txt" in z.namelist()
              with tempfile.TemporaryDirectory() as tmp:
                  z.extractall(tmp)
                  filename=pathlib.Path(tmp,"Devanagari-Cryptor-4.3.12.html").resolve()
                  async def run():
                      executable=shutil.which("google-chrome") or shutil.which("chromium")
                      async with async_playwright() as pw:
                          browser=await pw.chromium.launch(headless=True,executable_path=executable,args=["--no-sandbox"])
                          page=await browser.new_page()
                          errors=[]
                          page.on("pageerror",lambda e: errors.append(str(e)))
                          requests=[]
                          page.on("request",lambda r:requests.append(r.url))
                          await page.goto(filename.as_uri())
                          result=await page.evaluate("""async () => {
                            const core=window.DC_ARCHIVE_CORE;
                            const tabs=document.querySelectorAll(".mode-tab");
                            if(!core||tabs.length!==4)throw Error("App did not load");
                            document.querySelector('[data-mode="archive"]').click();
                            if(document.querySelector("#archiveSection").hidden)throw Error("Fourth tab unavailable");
                            const pwField=document.getElementById("arcCreatePassword");
                            if(!pwField||pwField.disabled||pwField.hidden)throw Error("ZIP password input unavailable");
                            const src=new File([new TextEncoder().encode("Local AES тест नमस्ते")],"secret.txt");
                            const encrypted=await core.zipWrite([{file:src,pathname:src.name}],"password.zip","LocalAES_123");
                            const opened=await core.zipOpen(encrypted,"LocalAES_123");
                            const restored=await opened.entries[0].extract();
                            await opened.close();
                            if(await restored.text()!=="Local AES тест नमस्ते")throw Error("Local AES roundtrip failed");
                            return {version:document.querySelector(".app-ver").textContent,
                              zipSize:encrypted.size,passwordInput:!!pwField,
                              tabs:tabs.length,files:opened.entries.length};
                          }""")
                          assert not errors,"Browser JS errors: "+str(errors)
                          outbound=[r for r in requests if r.startswith("http://") or r.startswith("https://")]
                          assert not outbound,"Network access detected in offline app: "+str(outbound)
                          print("EXACT PACKAGE file:// TEST PASS",result,"JS errors",errors,"external requests",len(outbound))
                          await browser.close()
                  asyncio.run(run())
          PY
      - name: Test existing archives from disk, automatic preview and real file extraction in 4.3.13
        shell: bash
        run: |
          set -euo pipefail
          /tmp/dc-playwright/bin/python - <<'PY'
          import pathlib,zipfile,pyzipper,gzip,io
          p=pathlib.Path("projects/devanagari-cryptor/test-fixtures")
          p.mkdir(exist_ok=True)
          old=b"OLD ARCHIVE 2015: real file bytes \x00\x01\xff"
          info=zipfile.ZipInfo("document-2015.txt",(2015,4,15,12,30,0))
          info.compress_type=zipfile.ZIP_DEFLATED
          with zipfile.ZipFile(p/"old-2015.zip","w") as z:z.writestr(info,old)
          with zipfile.ZipFile(p/"old-many.zip","w") as z:
              z.writestr("folder/one.txt",b"OLD-ONE",compress_type=zipfile.ZIP_DEFLATED)
              z.writestr("folder/two.txt",b"OLD-TWO",compress_type=zipfile.ZIP_STORED)
          with zipfile.ZipFile(p/"old-force-zip64.zip","w") as z:
              with z.open("old-zip64.txt","w",force_zip64=True) as writer:writer.write(b"ZIP64-OK")
          with pyzipper.AESZipFile(p/"old-aes.zip","w",compression=zipfile.ZIP_DEFLATED,encryption=pyzipper.WZ_AES) as z:
              z.setpassword(b"secret-old-zip")
              z.setencryption(pyzipper.WZ_AES,nbits=256)
              z.writestr("old-secret.txt",b"OLD AES-256 CONTENT")
          with gzip.open(p/"old-gzip.txt.gz","wb") as z:z.write(b"GZIP-OLD-OK")
          (p/"legacy-data.bin").write_bytes((p/"old-2015.zip").read_bytes())
          (p/"not-supported.rar").write_bytes(b"Rar!\x1a\x07\x01\x00"+b"\x00"*32)
          (p/"not-supported.7z").write_bytes(b"7z\xbc\xaf'\x1c"+b"\x00"*32)
          (p/"protected.bgdev").write_bytes(b"BGDF"+b"\x00"*40)
          print("Prepared independent existing archives")
          PY
          /tmp/dc-playwright/bin/python - <<'PY'
          import asyncio,pathlib,shutil
          from playwright.async_api import async_playwright
          root=pathlib.Path("projects/devanagari-cryptor/test-fixtures")
          async def main():
              exe=shutil.which("google-chrome") or shutil.which("chromium")
