                  page=await browser.new_page(viewport={"width":1280,"height":900},accept_downloads=True)
                  errors=[]
                  page.on("pageerror",lambda e:errors.append(str(e)))
                  await page.goto("http://127.0.0.1:8765/app-4.3.13-standalone.html")
