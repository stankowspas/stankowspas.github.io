                  try:
                      async with page.expect_download(timeout=7000) as event:
                          await page.locator("#arcExtract").click()
                      assert pathlib.Path(await (await event.value).path()).read_bytes()==b"OLD AES-256 CONTENT"
                  except Exception as exc:
                      print("AES EXTRACT DIAGNOSTIC:",str(exc),"status:",await page.locator("#arcStatus").inner_text(),"busy:",await page.locator("#arcExtract").is_disabled(),"selected:",await page.locator("#arcContent input:checked").count(),"JS ERRORS:",errors,"TRACE:",await page.evaluate("window.DC_ARC_TRACE"),"CURRENT:",await page.locator("#arcContent").inner_text(),flush=True)
                      raise
                  print("OLD third-party AES ZIP: password and extraction PASS")
                  await page.locator("#arcPassword").fill("")
                  await choose("old-gzip.txt.gz",1)
                  async with page.expect_download() as event:
                      await page.locator("#arcExtract").click()
                  assert pathlib.Path(await (await event.value).path()).read_bytes()==b"GZIP-OLD-OK"
                  print("OLD external GZIP: extracted PASS")
                  for archive,word in [("not-supported.rar","RAR"),("not-supported.7z","7Z"),("protected.bgdev",".bgdev")]:
                      await page.locator("#arcSource").set_input_files(root/archive)
                      await page.wait_for_function("() => document.querySelector('#arcStatus').classList.contains('archive-error')",timeout=15000)
                      assert word.lower() in (await page.locator("#arcStatus").inner_text()).lower()
                      assert await page.locator("#arcExtract").is_disabled()
                      print("Unsupported / protected file correctly explained:",archive)
                  assert not errors,errors
                  print("OLD ARCHIVES BROWSER SUITE: PASS, errors",errors)
                  await browser.close()
          asyncio.run(main())
          PY
