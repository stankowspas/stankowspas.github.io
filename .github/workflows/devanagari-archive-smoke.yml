                  async def choose(name,count):
                      await page.locator("#arcSource").set_input_files(root/name)
                      await page.wait_for_function("(n) => document.querySelectorAll('#arcContent input[type=checkbox]').length===n",arg=count,timeout=15000)
                      assert not await page.locator("#arcExtract").is_disabled(),name+" extract should be enabled"
                  # The file was independently created with Python and contains a 2015 timestamp.
                  await choose("old-2015.zip",1)
                  async with page.expect_download() as event:
