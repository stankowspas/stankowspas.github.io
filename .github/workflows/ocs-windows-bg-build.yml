name: Open CAD Studio Windows BG final clean start
on:
  push:
    paths:
      - .github/workflows/ocs-windows-bg-build.yml
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Fetch exact upstream source snapshot
        shell: pwsh
        run: |
          git clone https://github.com/HakanSeven12/OpenCADStudio.git source
          cd source
          git checkout 2476b151bc926f1ee43f32415f451a6ed59b41a2
      - name: Apply minimal BG and promotional-link patches
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path("source/src/i18n.rs")
          s = p.read_text(encoding="utf-8")
          a = '    #[default]\n    #[serde(rename = "system")]'
          b = '    #[serde(rename = "bg-BG")]'
          assert s.count(a) == 1 and s.count(b) == 1
          s = s.replace(a, '    #[serde(rename = "system")]', 1).replace(b, '    #[default]\n'+b, 1)
          needle = 'load_language(&loader, Language::System)'
          assert s.count(needle) == 1
          s = s.replace(needle, 'load_language(&loader, Language::BgBg)', 1)
          p.write_text(s, encoding="utf-8")
          p = Path("source/src/sys.rs")
          s = p.read_text(encoding="utf-8")
          needle = '#[cfg(all(not(target_arch = "wasm32"), not(target_os = "linux")))]\npub fn open_url<Message>(url: &str, _parent: Option<iced::window::Id>) -> iced::Task<Message> {\n    let _ = open::that_detached(url);'
          assert s.count(needle) == 1
          helper = """#[cfg(target_os = "windows")]
          fn is_promotional_url(url: &str) -> bool {
              let Ok(parsed) = url::Url::parse(url.trim()) else { return false };
              let host = parsed.host_str().unwrap_or("").to_ascii_lowercase();
              let path = parsed.path().to_ascii_lowercase();
              let blocked = ["patreon.com", "paypal.com", "paypal.me", "ko-fi.com",
                             "youtube.com", "youtu.be", "reddit.com"];
              if blocked.iter().any(|domain| host == *domain || host.ends_with(&format!(".{domain}"))) {
                  return true;
              }
              host == "github.com" &&
                (path.starts_with("/sponsors/") ||
                 (path.starts_with("/hakanseven12/opencadstudio/") &&
                  (path.contains("/releases") || path.contains("/discussions"))))
          }

          """
          replacement = helper + needle.replace('    let _ = open::that_detached(url);','    #[cfg(target_os = "windows")]\n    if !is_promotional_url(url) { let _ = open::that_detached(url); }\n    #[cfg(target_os = "macos")]\n    let _ = open::that_detached(url);')
          s = s.replace(needle, replacement, 1)
          p.write_text(s, encoding="utf-8")
          print("BG default and external promotional link patches applied")
          '@ | Set-Content patch.py -Encoding utf8
          python patch.py
      - name: Hide promotional widgets from Windows start page
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p=Path("source/src/app/view/mod.rs")
          s=p.read_text(encoding="utf-8")
          start=s.index("fn start_page_content<'a>(")
          end=s.index("    // Collapse side panels one at a time as width shrinks:",start)
          part=s[start:end]
          # Retain New, New from Template and Open, but remove Donate.
          assert part.count('        donate_btn.into(),') == 1
          part=part.replace('        donate_btn.into(),\n','',1)
          # Remove the prominent promotion from the visible center column.
          assert part.count('        container(reddit_btn).center_x(Fill),') == 1
          part=part.replace('        container(reddit_btn).center_x(Fill),\n','',1)
          assert part.count('        sponsors,') == 1
          part=part.replace('        sponsors,\n','',1)
          # Hide Send Feedback, keep application settings and plugin tools.
          a=part.index('        outline_btn(\\n            crate::tr!("start", "send-feedback"),')
          b=part.index('        outline_btn(crate::tr!("action", "options"),',a)
          part=part[:a]+part[b:]
          # Preserve other functional controls.
          # Disable desktop OCS Web promotion; retain options.
          needle='    #[cfg(not(target_arch = "wasm32"))]\n    {\n        // Filled with the active theme'
          a=part.index(needle)
          b=part.index('    #[cfg(target_arch = "wasm32")]',a)
          part=part[:a]+part[b:]
          s=s[:start]+part+s[end:]
          # Native Windows only: side promotional rails are not part of layout.
          a=s.index("    let body: Element<'a, Message> = match start_layout {",start)
          b=s.index("\n",s.index("\n    };",a)+6)
          block=s[a:b]
          replacement='''    #[cfg(target_os = "windows")]
              let body: Element<'a, Message> = iced::widget::row![recent, welcome]
                  .spacing(16)
                  .height(Fill)
                  .into();
              #[cfg(not(target_os = "windows"))]
          '''.replace("              ","    ")
          s=s[:a]+replacement+block+s[b:]
          p.write_text(s,encoding="utf-8")
          print("Promotional buttons and panels hidden on Windows")
          '@ | Set-Content hide-promo.py -Encoding utf8
          python hide-promo.py
      - name: Build standalone portable Windows executable
        shell: pwsh
        working-directory: source
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          cargo build --locked --release --bin OpenCADStudio
      - name: Verify executable and upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCADStudio_BG_Final_CleanUI_Windows
          path: source/target/release/OpenCADStudio.exe
          if-no-files-found: error
          retention-days: 7
