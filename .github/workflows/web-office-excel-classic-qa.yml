              const formula=panel.locator('.de-fx-input');
              await formula.click();await formula.fill('=SUM(12,30)');await formula.press('Enter');
              const result=panel.locator('.de-cell').getByText('42',{exact:true}).first();
              await result.waitFor();
              await result.click();
              assert.equal(await formula.inputValue(),'=SUM(12,30)');
              const search=panel.locator('.de-excel28-search-slot input');
              await search.fill('Bold');
              const hits=panel.locator('.de-excel27-search-list button');
              await hits.first().waitFor();
              await hits.first().click();
              const backup=panel.locator('.de-excel28-backup');
              await backup.waitFor();
              assert.equal(await backup.getAttribute('aria-checked'),'false');
              await backup.click();assert.equal(await backup.getAttribute('aria-checked'),'true');
              await backup.click();assert.equal(await backup.getAttribute('aria-checked'),'false');
              console.log('PASS actual name box, formula result, executable command search and local backup switch');
