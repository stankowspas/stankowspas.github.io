              await fd.locator('[data-format31="sz"]').fill('28');
              await fd.getByRole('button',{name:'Cancel',exact:true}).click();
              await fd.waitFor({state:'hidden'});
              await launch('number').click();
              await fd.waitFor();
              await fd.locator('[data-format31="numFmt"]').selectOption('0.00');
              assert.equal(await fd.locator('.de-excel31-sample>div').textContent(),'123.45');
              await fd.locator('[data-format31-tab="font"]').click();
