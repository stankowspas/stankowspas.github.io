            page.on('dialog',d=>d.accept());
            const dir=path.join(__dirname,'results');
            const shot=name=>page.screenshot({path:path.join(dir,name+'.png')});
            const panel=page.locator('#cryptor-office-excel');
            try{
              await page.goto('http://127.0.0.1:8765/projects/devanagari-cryptor/app-4.4.0.html',{waitUntil:'domcontentloaded'});
              await page.locator('#cryptor-tab-excel').waitFor({timeout:30000});
              await page.locator('#langSelect').selectOption('en');
              await page.locator('#cryptor-tab-excel').click();
              await panel.locator('.de-grid').waitFor({timeout:45000});
              await panel.locator('.de-excel28-quick-slot .de-excel-quick').waitFor({timeout:15000});
              await panel.locator('.de-excel28-search-slot input').waitFor({timeout:15000});
              assert.equal(await panel.locator('.de-office-ribbon-tabs .de-excel27-search').count(),0);
