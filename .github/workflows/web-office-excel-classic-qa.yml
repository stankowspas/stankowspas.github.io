              const download=page.waitForEvent('download',{timeout:30000});
              await backstage.locator('[data-file-command="original"]').click();
              const downloaded=await download;await downloaded.saveAs(path.join(dir,'classic-formula.xlsx'));
              require('node:child_process').execFileSync('python3',['-c','import zipfile,sys,xml.etree.ElementTree as E\nz=zipfile.ZipFile(sys.argv[1]);assert z.testzip() is None\nr=E.fromstring(z.read("xl/worksheets/sheet1.xml"));n={"s":"http://schemas.openxmlformats.org/spreadsheetml/2006/main"};assert any(f.text=="SUM(12,30)" for f in r.findall(".//s:f",n));assert any(v.text=="42" for v in r.findall(".//s:v",n))',path.join(dir,'classic-formula.xlsx')]);
