name: Excel classic desktop exact build and browser QA (no deployment)
on:
  push:
    branches: [web-office-excel-classic-qa]
    paths: ['.github/workflows/web-office-excel-classic-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-excel-classic-qa
  cancel-in-progress: true
jobs:
  browser:
    if: github.ref == 'refs/heads/web-office-excel-classic-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact consolidated Excel source and run all local regressions
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/web-office-excel-classic-qa
          mkdir -p "$RUNNER_TEMP/excel-source/base" "$RUNNER_TEMP/excel-build"
          base64 -d .qa/office29-patches.b64 > "$RUNNER_TEMP/excel-source.tar.gz"
          echo "ef61f6d9cea84ca0ab9b9974cfac573477f266f8dbb9fc0f75e1d5c10d656422  $RUNNER_TEMP/excel-source.tar.gz" | sha256sum --check
          tar xzf "$RUNNER_TEMP/excel-source.tar.gz" -C "$RUNNER_TEMP/excel-source"
          cp projects/devanagari-cryptor/app-4.4.0.html "$RUNNER_TEMP/excel-source/base/Web-Office-v17-Color-Scales-Preview.html"
          python3 "$RUNNER_TEMP/excel-source/build.py" --out "$RUNNER_TEMP/excel-build" --test
          mkdir -p "$RUNNER_TEMP/excel30"
          base64 -d .qa/office30-patches.b64 > "$RUNNER_TEMP/excel30.tar.gz"
          echo "237f10797e635bd4c7f13686e8c841cac22e7cb018bb38e96db548dfd3800500  $RUNNER_TEMP/excel30.tar.gz" | sha256sum --check
          tar xzf "$RUNNER_TEMP/excel30.tar.gz" -C "$RUNNER_TEMP/excel30"
          python3 "$RUNNER_TEMP/excel30/patch30.py" "$RUNNER_TEMP/excel-build/Web-Office-Excel-365-Refined-Interface.html" projects/devanagari-cryptor/app-4.4.0.html
          node --check "$RUNNER_TEMP/excel30/office-v30.js"
          mkdir -p "$RUNNER_TEMP/excel31"
          base64 -d .qa/office31-patches.b64 > "$RUNNER_TEMP/excel31.tar.gz"
          echo "dbd08594cd03dd4863564d3d4a0d425c9ef6c46946bc36e91397eda97ceaee2d  $RUNNER_TEMP/excel31.tar.gz" | sha256sum --check
          tar xzf "$RUNNER_TEMP/excel31.tar.gz" -C "$RUNNER_TEMP/excel31"
          cat >> "$RUNNER_TEMP/excel31/excel31.css" <<'CSS'
          /* Keep the entire tabbed dialog inside its own desktop frame; override generic dialog input widths only here. */
          .de-root.de-excel28.de-excel28 .de-dialog:has(.de-excel31-format){box-sizing:border-box;width:min(534px,calc(100vw - 24px))!important;max-width:min(534px,calc(100vw - 24px))!important;padding:14px 15px 12px;border-radius:5px}
          .de-root.de-excel28.de-excel28 .de-dialog .de-excel31-format{box-sizing:border-box;width:100%!important;max-width:100%;min-width:0}
          .de-root.de-excel28.de-excel28 .de-dialog .de-excel31-panel,.de-root.de-excel28.de-excel28 .de-dialog .de-excel31-fields,.de-root.de-excel28.de-excel28 .de-dialog .de-excel31-field{min-width:0;max-width:100%;box-sizing:border-box}
          .de-root.de-excel28.de-excel28 .de-dialog .de-excel31-check{justify-content:flex-start;align-items:center;gap:6px;text-align:left}
          .de-root.de-excel28.de-excel28 .de-dialog .de-excel31-check input[type=checkbox]{width:14px!important;min-width:14px!important;max-width:14px!important;height:14px;margin:0;flex:0 0 14px;padding:0}
          .de-root.de-excel28.de-excel28 .de-dialog .de-excel31-color input[type=color]{width:46px!important;min-width:46px!important;max-width:46px!important;height:26px!important;flex:0 0 46px;padding:2px!important;border-radius:2px}
          .de-root.de-excel28.de-excel28 .de-dialog:has(.de-excel31-format) .de-dialog-btns{margin-top:12px}
          .de-root.de-excel28.de-excel28 .de-dialog:has(.de-excel31-format) .de-dialog-btns button{min-width:76px;border-radius:3px;padding:5px 12px;font:12px var(--de-font)}
          @media(max-width:480px){.de-root.de-excel28.de-excel28 .de-dialog .de-excel31-field{grid-template-columns:1fr;gap:4px}.de-root.de-excel28.de-excel28 .de-dialog .de-excel31-panel{padding:8px}}
          CSS
          host=projects/devanagari-cryptor/app-4.4.0.html
          python3 "$RUNNER_TEMP/excel31/patch31.py" "$host" "$host"
          node --check "$RUNNER_TEMP/excel31/office-v31.js"
          mkdir -p "$RUNNER_TEMP/excel32"
          base64 -d .qa/office32-patches.b64 > "$RUNNER_TEMP/excel32.tar.gz"
          echo "585b580e1e24323c5a9d1f8a409995fad461d40ae103b41151fe662765bbd6ab  $RUNNER_TEMP/excel32.tar.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/excel32.tar.gz" > "$RUNNER_TEMP/excel32/patch32.py"
          python3 "$RUNNER_TEMP/excel32/patch32.py" "$host" "$host"
          node --check "$RUNNER_TEMP/excel32/office-v32.js"
          python3 - <<'PY'
          import re,base64,gzip,hashlib
          from pathlib import Path
          s=Path("projects/devanagari-cryptor/app-4.4.0.html").read_text()
          m=next(m for m in re.finditer(r'atob\("([A-Za-z0-9+/=]{10000,})"\)',s) if m[1].startswith("H4sI"))
          actual=hashlib.sha256(gzip.decompress(base64.b64decode(m[1]))).hexdigest()
          print("Exact editor bundle SHA256:",actual)
          assert actual=="581a85a7cbe0ee0043d1bf97b17c31427d845bd62d1fcd7f95b8c7c44f293271"
          PY
      - name: Prepare browser
        run: |
          npm install --prefix "$RUNNER_TEMP/excel-qa" playwright@1.51.1 --no-audit --no-fund
          "$RUNNER_TEMP/excel-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Inspect and test actual browser UI
        run: |
          mkdir -p "$RUNNER_TEMP/excel-qa/results"
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/excel-qa/server.log" 2>&1 &
          cat > "$RUNNER_TEMP/excel-qa/test.cjs" <<'JS'
