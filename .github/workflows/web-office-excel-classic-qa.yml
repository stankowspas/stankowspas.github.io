              const ribbon=panel.locator('.de-ribbon-home');
              const groups=await ribbon.locator(':scope > [data-ribbon-group]').evaluateAll(es=>es.map(e=>({id:e.dataset.ribbonGroup,box:e.getBoundingClientRect().toJSON()})));
              assert.deepEqual(groups.map(x=>x.id),['clipboard','font','alignment','number','styles','cells','editing']);
              for(let i=1;i<groups.length;i++)assert.ok(groups[i-1].box.right<=groups[i].box.left+1,'group overlap');
              fs.writeFileSync(path.join(dir,'home-control-geometry.json'),JSON.stringify({coords,groups},null,2));
              console.log('PASS clipboard labels single-line and nonoverlapping; explicit Home group geometry');
              await shot('excel-normal');
              const metrics=async()=>{const a={};for(const [name,selector] of Object.entries({title:'.de-bar',tabs:'.de-office-ribbon-tabs',ribbon:'.de-ribbon-classic',formula:'.de-fx',grid:'.de-grid',sheets:'.de-tabs',status:'.de-excel-status'})){a[name]=await panel.locator(selector).boundingBox();assert.ok(a[name],name)}return a};
              let measure=await metrics();assert.ok(measure.title.height>=38&&measure.title.height<=48);assert.ok(measure.ribbon.height>=100&&measure.ribbon.height<=115);assert.ok(measure.formula.height>=26&&measure.formula.height<=40);fs.writeFileSync(path.join(dir,'geometry-normal.json'),JSON.stringify(measure,null,2));
              await panel.locator('.cryptor-office-expand').click();
              await page.waitForFunction(()=>document.documentElement.hasAttribute('data-office-expanded'));
              await shot('excel-expanded');
              measure=await metrics();assert.ok(measure.grid.height>400);fs.writeFileSync(path.join(dir,'geometry-expanded.json'),JSON.stringify(measure,null,2));
              console.log('PASS rendered title/ribbon/formula dimensions and expanded sheet area');
              const file=panel.locator('button.de-file');
