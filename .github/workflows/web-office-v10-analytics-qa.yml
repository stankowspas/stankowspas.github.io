name: Web Office v10 Analytics QA (no deployment)
on:
  push:
    branches: [web-office-v10-analytics]
    paths: ['.github/workflows/web-office-v10-analytics-qa.yml','projects/devanagari-cryptor/app-4.4.0.html']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: web-office-v10-analytics-qa
  cancel-in-progress: true
jobs:
  browser:
    if: github.ref == 'refs/heads/web-office-v10-analytics'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Excel v10 analytics (test branch only)
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/web-office-v10-analytics
          cat > /tmp/excel-v10-report.js <<'JS'
          const EXCEL_V10_LABELS={bg:['Вид диаграма','Колонна','Хоризонтална','Линейна','Кръгова','Показател','Подреждане','Първоначално','Възходящо','Низходящо','Изтегли CSV','Кръговата диаграма изисква неотрицателни стойности и положителна сума.'],en:['Chart type','Column','Horizontal bar','Line','Pie','Metric','Sort','Original','Ascending','Descending','Download CSV','Pie charts require nonnegative values and a positive total.'],de:['Diagrammtyp','Säulen','Balken','Linie','Kreis','Kennzahl','Sortierung','Original','Aufsteigend','Absteigend','CSV herunterladen','Kreisdiagramme benötigen nichtnegative Werte und eine positive Summe.'],fr:['Type de graphique','Colonnes','Barres horizontales','Courbe','Secteurs','Indicateur','Tri','Original','Croissant','Décroissant','Télécharger CSV','Le graphique en secteurs exige des valeurs positives ou nulles et un total positif.'],es:['Tipo de gráfico','Columnas','Barras horizontales','Línea','Circular','Indicador','Orden','Original','Ascendente','Descendente','Descargar CSV','El gráfico circular requiere valores no negativos y una suma positiva.'],it:['Tipo di grafico','Colonne','Barre orizzontali','Linea','Torta','Indicatore','Ordinamento','Originale','Crescente','Decrescente','Scarica CSV','Il grafico a torta richiede valori non negativi e una somma positiva.'],pt:['Tipo de gráfico','Colunas','Barras horizontais','Linha','Circular','Indicador','Ordenação','Original','Crescente','Decrescente','Descarregar CSV','O gráfico circular exige valores não negativos e um total positivo.'],pl:['Typ wykresu','Kolumnowy','Poziomy','Liniowy','Kołowy','Miara','Sortowanie','Pierwotne','Rosnąco','Malejąco','Pobierz CSV','Wykres kołowy wymaga wartości nieujemnych i dodatniej sumy.'],ro:['Tip diagramă','Coloane','Bare orizontale','Linie','Circulară','Indicator','Sortare','Inițial','Crescător','Descrescător','Descarcă CSV','Diagrama circulară necesită valori nenegative și o sumă pozitivă.'],el:['Τύπος γραφήματος','Στήλες','Οριζόντιες ράβδοι','Γραμμή','Πίτα','Μέτρηση','Ταξινόμηση','Αρχική','Αύξουσα','Φθίνουσα','Λήψη CSV','Η πίτα απαιτεί μη αρνητικές τιμές και θετικό άθροισμα.'],cs:['Typ grafu','Sloupcový','Pruhový','Spojnicový','Výsečový','Ukazatel','Řazení','Původní','Vzestupně','Sestupně','Stáhnout CSV','Výsečový graf vyžaduje nezáporné hodnoty a kladný součet.'],hi:['चार्ट प्रकार','स्तंभ','क्षैतिज बार','रेखा','पाई','माप','क्रम','मूल','आरोही','अवरोही','CSV डाउनलोड','पाई चार्ट के लिए गैर-ऋणात्मक मान और धनात्मक योग आवश्यक हैं।']};
          function excelV10Sorted(rows,metric,sort) {
              return sort==='original'?rows.slice():rows.slice().sort((a,b)=>(sort==='asc'?1:-1)*(a[metric]-b[metric]));
