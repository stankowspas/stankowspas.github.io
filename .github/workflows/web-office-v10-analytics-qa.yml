          function excelV10PieOK(rows,metric) {
              return rows.every(r=>Number.isFinite(r[metric])&&r[metric]>=0)&&rows.some(r=>r[metric]>0);
          }
          function excelV10CSV(report,labels) {
              const field=v=>{if(typeof v==='number')return String(v);let s=String(v??'');if(/^\s*[=+\-@]|^[\t\r\n]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
              return '\ufeff'+[[report.categoryName,labels[5],labels[6],labels[7]],...report.rows.map(r=>[r.name,r.count,r.sum,r.avg])].map(row=>row.map(field).join(',')).join('\r\n')+'\r\n';
          }
          function excelV10Chart(report,metric,type,title) {
              const rows=report.rows, pie=type==='pie', horizontal=type==='horizontal';
              if(pie&&!excelV10PieOK(rows,metric))return '';
              const colors=['#4472c4','#ed7d31','#70ad47','#a5a5a5','#ffc000','#5b9bd5','#8064a2','#c0504d'];
              const series={name:title,cats:rows.map(r=>r.name),values:rows.map(r=>r[metric]),fill:colors[0],points:pie?Object.fromEntries(rows.map((r,i)=>[i,{color:colors[i%colors.length]}])):{},format:'General'};
              if(type==='line'){series.line={color:colors[0],width:2};series.marker={symbol:'circle',size:5,fill:colors[0],line:{color:colors[0],width:1}};}
              const group={type:pie?'pie':type==='line'?'line':'bar',dir:horizontal?'bar':'col',grouping:'clustered',gapWidth:100,overlap:0,varyColors:pie,firstSliceAng:0,axIds:pie?[]:['c','v'],series:[series]};
              const model={groups:[group],axes:pie?[]:[{id:'c',kind:'cat',pos:horizontal?'l':'b',deleted:false,reverse:false,gridlines:false,labels:true,crossAx:'v',crosses:'autoZero'},{id:'v',kind:'val',pos:horizontal?'b':'l',deleted:false,reverse:false,gridlines:true,labels:true,crossAx:'c',crosses:'autoZero'}],fontSize:10,textColor:'#222222',bg:'#ffffff',border:null,gridColor:'#dddddd',axisColor:'#666666',blanks:'gap',date1904:false,title:{text:title,size:14,bold:true,color:'#222222'},...(pie?{legend:{pos:'r',overlay:false}}:{})};
              return chartV91.renderChart(model,640,360);
          }
          function ExcelV91Report({report,labels,onClose,ok,locale}) {
              const x=jsx_runtime_1.jsx,xs=jsx_runtime_1.jsxs;
              const Dialog=wordV91UI.useHostUI().Dialog??wordV91UI.DefaultDialog;
              const L=EXCEL_V10_LABELS[String(locale||'en').split('-')[0]]||EXCEL_V10_LABELS.en;
              const [chart,setChart]=react_1.useState(false),[metric,setMetric]=react_1.useState('sum'),[type,setType]=react_1.useState('column'),[sort,setSort]=react_1.useState('original');
              const rows=react_1.useMemo(()=>excelV10Sorted(report.rows,metric,sort),[report,metric,sort]);
              const shown={...report,rows}, pieOK=excelV10PieOK(rows,metric);
              const metricLabel={sum:labels[6],count:labels[5],avg:labels[7]}[metric];
              const svg=react_1.useMemo(()=>chart?excelV10Chart({...report,rows},metric,type,report.valueName+' — '+metricLabel):'',[chart,report,rows,metric,type,metricLabel]);
              const [url,setUrl]=react_1.useState('');
              react_1.useEffect(()=>{if(!svg){setUrl('');return;}const u=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));setUrl(u);return ()=>URL.revokeObjectURL(u);},[svg]);
              const fmt=n=>Number.isFinite(n)?String(Number(n.toPrecision(12))):String(n);
              const download=(href,name)=>{const a=document.createElement('a');a.href=href;a.download=name;a.click();};
              const saveCSV=()=>{const u=URL.createObjectURL(new Blob([excelV10CSV(shown,labels)],{type:'text/csv;charset=utf-8'}));download(u,'category-summary.csv');setTimeout(()=>URL.revokeObjectURL(u),60000);};
              const chooser=(id,title,value,change,opts)=>xs('label',{style:{display:'flex',flexDirection:'column',gap:3},children:[x('span',{children:title}),x('select',{'aria-label':title,'data-summary-control':id,value,onChange:e=>change(e.target.value),style:{background:'var(--de-chrome)',color:'var(--de-ink)',border:'1px solid var(--de-border)',padding:5,borderRadius:4},children:opts.map(([v,t])=>x('option',{value:v,children:t},v))})]},id);
              const chooseType=t=>setType(t);
              const controls=xs('div',{style:{display:'flex',gap:10,flexWrap:'wrap',margin:'8px 0'},children:[chooser('metric',L[5],metric,setMetric,[['sum',labels[6]],['count',labels[5]],['avg',labels[7]]]),chooser('sort',L[6],sort,setSort,[['original',L[7]],['asc',L[8]],['desc',L[9]]]),chart&&chooser('type',L[0],type,chooseType,[['column',L[1]],['horizontal',L[2]],['line',L[3]],['pie',L[4]]])]});
              return x(Dialog,{title:labels[1],onClose,actions:[{label:labels[3],onClick:()=>setChart(c=>!c)},{label:L[10],onClick:saveCSV},...(chart&&svg&&url?[{label:labels[9],onClick:()=>download(url,'category-summary.svg')}]:[]),{label:ok,primary:true,autoFocus:true,onClick:onClose}],children:xs('div',{className:'de-excel-summary',style:{maxHeight:'55vh',overflow:'auto',minWidth:'min(420px,70vw)'},children:[x('p',{children:labels[10]}),controls,chart&&type==='pie'&&!pieOK&&x('p',{role:'status',children:L[11]}),chart&&svg&&url&&x('img',{className:'de-excel-summary-chart',src:url,alt:labels[3],style:{width:'100%',maxWidth:640}}),xs('table',{style:{width:'100%',borderCollapse:'collapse'},children:[x('thead',{children:x('tr',{children:[report.categoryName,labels[5],labels[6],labels[7]].map((v,i)=>x('th',{style:{padding:'5px',textAlign:i?'right':'left',borderBottom:'1px solid var(--de-border)'},children:v},i))})}),x('tbody',{children:rows.map((r,i)=>x('tr',{children:[r.name,r.count,fmt(r.sum),fmt(r.avg)].map((v,j)=>x('td',{style:{padding:'5px',textAlign:j?'right':'left',borderBottom:'1px solid var(--de-border)'},children:v},j))},i))})]}),x('p',{children:labels[8]+': '+report.skipped})]})});
          }
          JS
          python3 - <<'PY'
          from pathlib import Path
          import re,gzip,base64
          host=Path('projects/devanagari-cryptor/app-4.4.0.html')
          s=host.read_text(encoding='utf-8')
          m=next(m for m in re.finditer(r'atob\("([A-Za-z0-9+/=]{10000,})"\)',s) if m[1].startswith('H4sI'))
          b=gzip.decompress(base64.b64decode(m[1])).decode()
          assert 'EXCEL_V91_LABELS' in b and 'WORD_V82_LABELS' in b
          if 'EXCEL_V10_LABELS' not in b:
              a=b.index('function ExcelV91Report(');z=b.index('function SheetGrid(',a)
              b=b[:a]+Path('/tmp/excel-v10-report.js').read_text(encoding='utf-8')+b[z:]
              old='labels:extraDataLabels,ok:str.common.ok,onClose:'
              assert b.count(old)==1
              b=b.replace(old,'labels:extraDataLabels,ok:str.common.ok,locale:str.locale,onClose:')
              host.write_text(s[:m.start(1)]+base64.b64encode(gzip.compress(b.encode(),mtime=0)).decode()+s[m.end(1):],encoding='utf-8')
          Path('/tmp/office-v10.js').write_text(b,encoding='utf-8')
          PY
          node --check /tmp/office-v10.js
          git add projects/devanagari-cryptor/app-4.4.0.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Excel v10: chart types, metric, sorting and safe CSV export'
            git push origin HEAD:refs/heads/web-office-v10-analytics
          fi
      - name: Package exact source and single HTML previews
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json, base64, shutil, mimetypes
          root=Path('projects/devanagari-cryptor')
          src=root/'pdf-editor'
          out=Path('pdf-preview')
          out.mkdir()
          raw=src.joinpath('index.html').read_text(encoding='utf-8')
          def data(path):
              mime='font/woff2' if path.suffix=='.woff2' else 'font/ttf'
              return 'data:'+mime+';base64,'+base64.b64encode(path.read_bytes()).decode()
          fonts={p.name:data(p) for p in (src/'fonts').iterdir() if p.is_file()}
          def font_css(css):
              return re.sub(r'fonts/([\w.-]+\.(?:woff2|ttf))',lambda m:fonts.get(m[1],m[0]),css)
          for name in ['styles.css','office-theme.css']:
              raw=raw.replace('<link rel="stylesheet" href="'+name+'">','<style>'+font_css((src/name).read_text(encoding='utf-8'))+'</style>')
          ui=(src/'office-ui.js').read_text(encoding='utf-8')
          ui=ui.replace('new URLSearchParams(location.search)','new URLSearchParams(location.search || window.name)').replace('e.origin!==location.origin','e.origin!==window.origin')
          ui=ui.replace('params.get("lang"):"en"','params.get("lang"):"bg"')
          app=(src/'app.js').read_text(encoding='utf-8')
          app=app.replace("return `fonts/${F.web}-latin-${VARIANT_CSS[v][0]}-${VARIANT_CSS[v][1]}.woff2`;","return previewFonts[`${F.web}-latin-${VARIANT_CSS[v][0]}-${VARIANT_CSS[v][1]}.woff2`];")
          app=app.replace("`fonts/${f}`","previewFonts[f]")
          app='const previewFonts='+json.dumps(fonts,separators=(',',':'))+';\n'+app
          def safe(s): return re.sub(r'</script',r'<\\/script',s,flags=re.I)
          raw=raw.replace('<script defer src="office-ui.js"></script>','<script defer type="module">'+safe(ui)+'</script>')
          raw=raw.replace('<script type="module" src="app.js"></script>','<script type="module">'+safe(app)+'</script>')
          assert 'previewFonts' in raw and 'src="app.js"' not in raw
          (out/'PDF-Editor.html').write_text(raw,encoding='utf-8')
          # Keep the exact original integrated folder for a local HTTP-server review.
          folder=out/'Web-Office-original'
          folder.mkdir()
          shutil.copy2(root/'app-4.4.0.html',folder/'app-4.4.0.html')
          shutil.copytree(src,folder/'pdf-editor')
          main=(root/'app-4.4.0.html').read_text(encoding='utf-8')
          bridge=(src/'bridge.js').read_text(encoding='utf-8')
          bridge=bridge.replace('postMessage(settings(),location.origin)','postMessage(settings(),window.origin==="null"?"*":window.origin)')
          enc=base64.b64encode(raw.encode()).decode()
          bridge=bridge.replace('frame.src=url.href;','frame.name=url.searchParams.toString();frame.srcdoc=new TextDecoder().decode(Uint8Array.from(atob("'+enc+'"),c=>c.charCodeAt(0)));')
          assert 'frame.srcdoc=' in bridge
          pattern=r'<script\b[^>]*\bsrc\s*=\s*["\'](?:\./)?pdf-editor/bridge\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script\s*>'
          main,count=re.subn(pattern,lambda m:'<script>'+safe(bridge)+'</script>',main,flags=re.I)
          if count==1:
              (out/'Web-Office-PDF-Editor.html').write_text(main,encoding='utf-8')
          else:
              print('Integrated standalone not generated: bridge tag match count',count)
          (out/'README.txt').write_text('Preview only; not deployed. Open PDF-Editor.html or Web-Office-PDF-Editor.html in Chrome/Edge. Internet is required for CDN PDF engines. For the exact unmodified source folder, run python -m http.server 8765 inside Web-Office-original and open http://localhost:8765/app-4.4.0.html. Standalone packaging is for review only, not a production release.\n',encoding='utf-8')
          shutil.copy2(src/'LICENSE',out/'LICENSE')
          print([(p.name,p.stat().st_size) for p in out.glob('*.html')])
          PY
