name: Web Office v11 Recovery QA (no deployment)
on:
  push:
    branches: [web-office-v11-recovery]
    paths: ['.github/workflows/web-office-v11-recovery-qa.yml','projects/devanagari-cryptor/app-4.4.0.html']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: web-office-v11-recovery-qa
  cancel-in-progress: true
jobs:
  browser:
    if: github.ref == 'refs/heads/web-office-v11-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install v11 local recovery and templates (test branch only)
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/web-office-v11-recovery
          cat > /tmp/office-v11-recovery.js <<'HELPERS'
          // Optional browser-local backups: a single native document per editor, never uploaded.
          const OFFICE_RECOVERY_LIMIT=25*1024*1024;
          const OFFICE_RECOVERY_DB='WebOfficeRecoveryV11';
          function officeRecoveryIO(op,key,value) {
              return new Promise((resolve,reject)=>{
                  let db,done=false;
                  const finish=(error,result)=>{if(done)return;done=true;db?.close();error?reject(error):resolve(result);};
                  let req;
                  try{req=indexedDB.open(OFFICE_RECOVERY_DB,1);}catch(e){finish(e);return;}
                  req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('drafts'))req.result.createObjectStore('drafts');};
                  req.onblocked=()=>finish(Error('Local backup database is blocked.'));
                  req.onerror=()=>finish(req.error||Error('Local backup database unavailable.'));
                  req.onsuccess=()=>{
                      db=req.result;if(done){db.close();return;}
                      try{
                          const tx=db.transaction('drafts',op==='get'?'readonly':'readwrite');
                          const store=tx.objectStore('drafts');
                          const request=op==='get'?store.get(key):op==='put'?store.put(value,key):store.delete(key);
                          tx.oncomplete=()=>finish(null,request.result);
                          tx.onabort=()=>finish(tx.error||request.error||Error('Local backup transaction aborted.'));
                          tx.onerror=()=>finish(tx.error||request.error||Error('Local backup transaction failed.'));
                      }catch(e){finish(e);}
                  };
              });
          }
          function officeRecoveryValid(record,key) {
              const ext=key==='word'?'.docx':key==='excel'?'.xlsx':null;
              return !!(ext&&record&&record.blob instanceof Blob&&record.blob.size>0&&record.blob.size<=OFFICE_RECOVERY_LIMIT&&typeof record.name==='string'&&record.name.toLowerCase().endsWith(ext)&&Number.isFinite(record.time)&&record.time>0);
          }
          function officeV11Labels(locale) {
              const bg=String(locale||'').split('-')[0]==='bg';
              return bg?['Локално възстановяване','Автоматично резервно копие на 15 секунди','Създай копие сега','Възстанови копието','Изтрий копието','Няма локално копие.','Копието е само в този браузър, до 25 MiB. Не заменя изтеглянето на файл. Ново копие заменя предишното.','Запис…','Копието е записано.','Да се изтрие локалното копие?','Шаблон: протокол от среща','Шаблон: проектен отчет','Шаблон: бюджет','Шаблон: списък със задачи','Файлът не е достъпен за локално копие.','Резервното копие надвишава 25 MiB.','Документът се промени. Опитай отново.']:
              ['Local recovery','Automatic backup every 15 seconds','Back up now','Restore backup','Delete backup','No local backup.','Stored only in this browser, up to 25 MiB. This is not a substitute for downloading the file. A new backup replaces the previous one.','Saving…','Backup saved.','Delete the local backup?','Template: meeting minutes','Template: project report','Template: budget','Template: task list','This file is not available for local backup.','Backup exceeds 25 MiB.','The document changed. Try again.'];
          }
          function officeV11Template(key,bg) {
              const para=(text,heading)=>({runs:[{text}],...(heading?{heading}:{})});
              const text=bg?{
                  minutes:['Протокол от среща','Дата: ','Участници: ','Дневен ред','Обсъждане','Решения','Следващи действия','Отговорник и срок: '],
                  report:['Проектен отчет','Проект: ','Период: ','Резюме','Изпълнени дейности','Рискове и проблеми','Следващи стъпки'],
                  budget:[['Категория','Планирано (EUR)','Действително (EUR)'],['Приходи','',''],['Разходи','','']],
                  tasks:[['Задача','Отговорник','Начална дата','Краен срок','Статус'],['','','','','']]
              }:{
                  minutes:['Meeting minutes','Date: ','Participants: ','Agenda','Discussion','Decisions','Next actions','Owner and due date: '],
                  report:['Project report','Project: ','Period: ','Summary','Completed work','Risks and issues','Next steps'],
                  budget:[['Category','Planned (EUR)','Actual (EUR)'],['Income','',''],['Expenses','','']],
                  tasks:[['Task','Owner','Start date','Due date','Status'],['','','','','']]
              };
              if(key==='minutes'||key==='report'){
                  const arr=text[key], headings=key==='minutes'?[3,4,5,6]:[3,4,5,6];
                  return {name:arr[0]+'.docx',blob:convert_1.parasToDocx(arr.flatMap((v,i)=>headings.includes(i)?[para(v,2),{runs:[]}]:[para(v,i===0?1:0)]))};
              }
              if(key==='budget'||key==='tasks'){
                  const name=key==='budget'?(bg?'Бюджет':'Budget'):(bg?'Задачи':'Tasks');
                  return {name:name+'.xlsx',blob:convert_1.rowsToXlsx(text[key],name)};
              }
              throw Error('Unknown template');
          }
          function OfficeRecoveryPanel({labels,record,auto,busy,note,locale,onAuto,onBackup,onRestore,onDelete,onClose,ok}) {
              const x=jsx_runtime_1.jsx,xs=jsx_runtime_1.jsxs;
              const Dialog=ui_1.useHostUI().Dialog??ui_1.DefaultDialog;
              const button=(id,text,click,disabled)=>x('button',{type:'button',className:'de-btn','data-recovery-action':id,disabled,onClick:click,children:text},id);
              return x(Dialog,{title:labels[0],onClose,actions:[{label:ok,primary:true,autoFocus:true,onClick:onClose}],children:xs('div',{className:'de-office-recovery',style:{maxWidth:420},children:[x('p',{children:labels[6]}),xs('label',{style:{display:'flex',gap:8,alignItems:'center'},children:[x('input',{type:'checkbox','data-recovery-auto':true,checked:auto,disabled:busy,onChange:e=>onAuto(e.target.checked)}),labels[1]]}),x('p',{'data-recovery-record':true,children:record?record.name+' — '+new Date(record.time).toLocaleString(locale||'en'):labels[5]}),xs('div',{style:{display:'flex',gap:6,flexWrap:'wrap'},children:[button('backup',labels[2],onBackup,busy),button('restore',labels[3],onRestore,busy||!record),button('delete',labels[4],onDelete,busy||!record)]}),x('p',{role:'status','data-recovery-status':true,children:busy?labels[7]:note})]})});
          }
          HELPERS
          cat > /tmp/office-v11-state.js <<'STATE'
              // Recovery belongs to the exact native file and editor slot; collaboration and imports are excluded.
              const recoveryKey=props.officeRecoveryKey;
              const recoveryLabels=officeV11Labels(t.locale);
              const recoveryAvailable=!!client&&!loading&&!readOnly&&!props.collab&&!client.interceptor&&!srcFormat&&allowOpen&&allowSave&&((recoveryKey==='word'&&client.kind==='docx'&&officeExt==='.docx')||(recoveryKey==='excel'&&client.kind==='xlsx'&&officeExt==='.xlsx'));
              const recoveryEligible=(0,react_1.useRef)(false);recoveryEligible.current=recoveryAvailable;
              const [recoveryOpen,setRecoveryOpen]=(0,react_1.useState)(false);
              const [recoveryRecord,setRecoveryRecord]=(0,react_1.useState)(null);
              const [recoveryAutoSession,setRecoveryAutoSession]=(0,react_1.useState)(null);
              const [recoveryBusy,setRecoveryBusy]=(0,react_1.useState)(false);
              const [recoveryNote,setRecoveryNote]=(0,react_1.useState)('');
              const recoveryLock=(0,react_1.useRef)(false);
              const recoveryAuto=recoveryAvailable&&recoveryAutoSession===saveSession;
              (0,react_1.useEffect)(()=>{if(!recoveryAvailable){setRecoveryOpen(false);setRecoveryAutoSession(null);}},[recoveryAvailable]);
              const readRecovery=async()=>{
                  if(recoveryLock.current)return;recoveryLock.current=true;setRecoveryBusy(true);setRecoveryNote('');
                  try{const record=await officeRecoveryIO('get',recoveryKey);setRecoveryRecord(officeRecoveryValid(record,recoveryKey)?record:null);}
                  catch(e){setRecoveryNote(e.message||String(e));}
                  finally{recoveryLock.current=false;setRecoveryBusy(false);}
              };
              const backupNow=async(manual)=>{
                  if(!recoveryAvailable||!recoveryEligible.current||!saveSession.live||recoveryLock.current||saveSession.saving){if(manual)setRecoveryNote(recoveryLabels[14]);return;}
                  if(!manual&&(!dirtyNow.current||saveSession.recoveryRevision===saveSession.revision))return;
                  recoveryLock.current=true;saveSession.saving=true;setRecoveryBusy(true);setSaving(true);setRecoveryNote('');
                  try{
                      await fileOps.current?.flush?.();
                      if(!saveSession.live||!recoveryEligible.current||client.interceptor)return;
                      const revision=saveSession.revision;
                      const blob=await client.call('save');
                      if(!saveSession.live||!recoveryEligible.current||client.interceptor)return;
                      if(saveSession.revision!==revision){if(manual)setRecoveryNote(recoveryLabels[16]);return;}
                      if(!(blob instanceof Blob)||blob.size>OFFICE_RECOVERY_LIMIT)throw Error(recoveryLabels[15]);
                      const record={name:fileName,blob,time:Date.now()};
                      if(!officeRecoveryValid(record,recoveryKey))throw Error(recoveryLabels[14]);
                      await officeRecoveryIO('put',recoveryKey,record);
                      saveSession.recoveryRevision=revision;
                      setRecoveryRecord(record);setRecoveryNote(recoveryLabels[8]);
                  }catch(e){setRecoveryNote(e.message||String(e));if(!manual){setRecoveryAutoSession(null);setToast(e.message||String(e));}}
                  finally{saveSession.saving=false;recoveryLock.current=false;setRecoveryBusy(false);if(saveSession.live)setSaving(false);}
              };
              const recoveryTick=(0,react_1.useRef)(backupNow);recoveryTick.current=backupNow;
              (0,react_1.useEffect)(()=>{if(!recoveryAuto)return;const timer=setInterval(()=>void recoveryTick.current(false),15000);return()=>clearInterval(timer);},[recoveryAuto,saveSession]);
              const restoreRecovery=()=>{
                  const record=recoveryRecord;if(!recoveryAvailable||!officeRecoveryValid(record,recoveryKey)||recoveryLock.current)return;
                  setRecoveryOpen(false);setRecoveryAutoSession(null);
                  replace(t.bar.replaceOpen(record.name),async()=>{
                      if(!saveSession.live||!recoveryEligible.current)return;
                      recoveryLock.current=true;setRecoveryBusy(true);
                      try{
                          const check=await client_1.DocumentClient.open(record.blob,{name:record.name,worker});check.destroy();
                          if(!saveSession.live||!recoveryEligible.current)return;
                          show({src:record.blob,name:record.name,converted:false},true);openedDirty.current=true;
                      }catch(e){setToast(e.message||String(e));}
                      finally{recoveryLock.current=false;setRecoveryBusy(false);}
                  });
              };
              const deleteRecovery=async()=>{
                  if(recoveryLock.current||!window.confirm(recoveryLabels[9]))return;
                  setRecoveryAutoSession(null);recoveryLock.current=true;setRecoveryBusy(true);
                  try{await officeRecoveryIO('delete',recoveryKey);setRecoveryRecord(null);setRecoveryNote('');}
                  catch(e){setRecoveryNote(e.message||String(e));}finally{recoveryLock.current=false;setRecoveryBusy(false);}
              };
              const createTemplate=(key)=>{
                  const bg=String(t.locale||'').split('-')[0]==='bg';
                  replace(t.bar.replaceNew(t.newWhat[client.kind]),async()=>{
                      try{const template=officeV11Template(key,bg),blob=await template.blob;if(!saveSession.live||!recoveryEligible.current)return;show({src:blob,name:template.name,converted:false},true);openedDirty.current=true;}
                      catch(e){setToast(e.message||String(e));}
                  });
              };
              const recoveryItems=recoveryAvailable?[{label:recoveryLabels[0],icon:'save',onClick:()=>{setRecoveryOpen(true);void readRecovery();}},...(recoveryKey==='word'?[{label:recoveryLabels[10],icon:'doc',onClick:()=>createTemplate('minutes')},{label:recoveryLabels[11],icon:'doc',onClick:()=>createTemplate('report')}]:[{label:recoveryLabels[12],icon:'table',onClick:()=>createTemplate('budget')},{label:recoveryLabels[13],icon:'table',onClick:()=>createTemplate('tasks')}])]:[];
          STATE
          python3 - <<'PY'
          from pathlib import Path
          import gzip,base64,re
          host=Path('projects/devanagari-cryptor/app-4.4.0.html')
          s=host.read_text(encoding='utf-8');m=next(m for m in re.finditer(r'atob\("([A-Za-z0-9+/=]{10000,})"\)',s) if m[1].startswith('H4sI'));b=gzip.decompress(base64.b64decode(m[1])).decode()
          assert 'EXCEL_V10_LABELS' in b
          def one(s,a,c):
              assert s.count(a)==1,(a[:100],s.count(a));return s.replace(a,c,1)
          def edit(mod,fn):
              global b
              a=b.index('"'+mod+'":function');z=b.index('\n},\n',a);b=b[:a]+fn(b[a:z])+b[z:]
          def viewer(s):
              s=one(s,'function DocViewer(props) {',Path('/tmp/office-v11-recovery.js').read_text()+'function DocViewer(props) {')
              s=one(s,'    const fileActions = (0, FileMenu_1.useFileActions)({',Path('/tmp/office-v11-state.js').read_text()+'    const fileActions = (0, FileMenu_1.useFileActions)({')
              s=one(s,'        extra: props.fileMenuItems ?? [],','        extra: [...(props.fileMenuItems ?? []), ...recoveryItems],')
              a='toast && (0, jsx_runtime_1.jsx)(Dialog_1.Toast, { text: toast, onDone: clearToast }), confirm &&'
              c='recoveryOpen && recoveryAvailable && (0,jsx_runtime_1.jsx)(OfficeRecoveryPanel,{labels:recoveryLabels,record:recoveryRecord,auto:recoveryAuto,busy:recoveryBusy,note:recoveryNote,locale:t.locale,onAuto:v=>setRecoveryAutoSession(v?saveSession:null),onBackup:()=>void backupNow(true),onRestore:restoreRecovery,onDelete:()=>void deleteRecovery(),onClose:()=>setRecoveryOpen(false),ok:t.common.ok}), '+a
              return one(s,a,c)
          def hostmod(s):
              return one(s,'className: "cryptor-office-layout", ...settings(),','className: "cryptor-office-layout", officeRecoveryKey: panel.mode, ...settings(),')
          if 'OFFICE_RECOVERY_DB=' not in b:
              edit('src/react/DocViewer.tsx',viewer);edit('integration/host.mjs',hostmod)
              host.write_text(s[:m.start(1)]+base64.b64encode(gzip.compress(b.encode(),mtime=0)).decode()+s[m.end(1):],encoding='utf-8')
          Path('/tmp/office-v11.js').write_text(b,encoding='utf-8')
          PY
