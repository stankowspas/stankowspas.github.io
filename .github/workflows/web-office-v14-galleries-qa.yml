              python('python3',['-c','import zipfile,sys,xml.etree.ElementTree as E\nz=zipfile.ZipFile(sys.argv[1]);assert z.testzip() is None\nr=E.fromstring(z.read("xl/worksheets/sheet1.xml"));n={"s":"http://schemas.openxmlformats.org/spreadsheetml/2006/main"}\nassert r.find("s:sheetProtection",n).get("sheet")=="1"\nassert r.find("s:dataValidations/s:dataValidation",n).get("sqref")=="C2"\nassert r.find("s:dataValidations/s:dataValidation/s:formula1",n).text==chr(34)+"Yes,No"+chr(34)\nassert any(f.text=="SUM(7,35)" for f in r.findall(".//s:f",n))',protectedOut]);
              console.log('PASS imported protected XLSX rejects locked-cell edit and preserves existing list validation and formula on download');
              await page.locator('#cryptor-tab-word').click();
              await wordDoc.getByText('Project report',{exact:true}).waitFor();
              await wordDoc.locator('.de-p').last().click();await page.keyboard.press('End');await page.keyboard.insertText('Проверка на кирилица');
              await wordDoc.getByText(/Проверка на кирилица/).first().waitFor();
              const docx=path.join(dir,'native-roundtrip.docx');
              await downloadNative(wp,'Word document',docx);
              python('python3',['-c','import zipfile,sys,xml.etree.ElementTree as E\nz=zipfile.ZipFile(sys.argv[1]);assert z.testzip() is None\nr=E.fromstring(z.read("word/document.xml"));n={"w":"http://schemas.openxmlformats.org/wordprocessingml/2006/main"}\nt="".join(x.text or "" for x in r.findall(".//w:t",n));assert "Проверка на кирилица" in t and "Project report" in t\nassert any(x.get("{"+n["w"]+"}val")=="Heading1" for x in r.findall(".//w:pStyle",n))',docx]);
              await openNative(wp,docx);
              await wordDoc.getByText(/Проверка на кирилица/).first().waitFor();
              await wordDoc.getByText('Project report',{exact:true}).waitFor();
              console.log('PASS native DOCX download, ZIP/XML Cyrillic and heading styles, reopen with intact document');

              // Check the classic ribbon groups and actual browser clipboard interaction.
              await page.context().grantPermissions(['clipboard-read','clipboard-write']);
              await page.locator('#cryptor-tab-word').click();
              await wp.locator('[data-ribbon-tab="home"]').click();
              const clipboard=wp.locator('[data-ribbon-group="clipboard"]');
              await clipboard.waitFor();
              assert.equal(await wp.locator('[data-ribbon-group="font"] .de-ribbon-caption').textContent(),'Font');
              await wordDoc.locator('.de-p').last().click();await page.keyboard.press('End');
              await page.evaluate(()=>navigator.clipboard.writeText(' ClassicRibbonQA'));
              await clipboard.getByRole('button',{name:'Paste',exact:true}).click();
              await wordDoc.getByText(/ClassicRibbonQA/).first().waitFor();
              await wp.locator('[data-ribbon-tab="references"]').click();
              await wp.getByRole('button',{name:'Contents from headings',exact:true}).waitFor();
              await wp.locator('[data-ribbon-tab="home"]').click();
              await page.screenshot({path:path.join(dir,'word-classic-ribbon.png')});
              await page.locator('#cryptor-tab-excel').click();
              await ep.locator('[data-ribbon-tab="home"]').click();
              await ep.locator('[data-ribbon-group="number"]').waitFor();
              await ep.locator('[data-ribbon-group="alignment"]').waitFor();
              await ep.locator('[data-ribbon-group="cells"]').waitFor();
              await ep.locator('[data-ribbon-tab="insert"]').click();
              await ep.getByRole('button',{name:'Category summary',exact:true}).waitFor();
              await ep.locator('[data-ribbon-tab="home"]').click();
              await page.screenshot({path:path.join(dir,'excel-classic-ribbon.png')});
              console.log('PASS classic ribbon command grouping, native paste, References and Insert tabs');

              await page.locator('#cryptor-tab-word').click();
              await wp.locator('[data-ribbon-tab="home"]').click();
              await wordDoc.locator('.de-p').last().click();
              const wg=wp.locator('[data-ribbon-group="styles"] .de-style-gallery');
              assert.equal(await wg.locator('[data-style-tile]').count(),5);
              const h2=wg.locator('[data-style-tile]').nth(4);
              await h2.click();
              await h2.waitFor();assert.equal(await h2.getAttribute('aria-pressed'),'true');
              const styleDocx=path.join(dir,'style-gallery.docx');
              await downloadNative(wp,'Word document',styleDocx);
              python('python3',['-c','import zipfile,sys,xml.etree.ElementTree as E\nz=zipfile.ZipFile(sys.argv[1]);r=E.fromstring(z.read("word/document.xml"));n={"w":"http://schemas.openxmlformats.org/wordprocessingml/2006/main"};assert any(x.get("{"+n["w"]+"}val")=="Heading2" for x in r.findall(".//w:pStyle",n))',styleDocx]);
              console.log('PASS Word visual gallery applies native paragraph heading style');
              for(const theme of ['dark','sand','blue','graphite','black-platinum','black-gold']){
                await themes.selectOption(theme);
                await page.waitForFunction(t=>document.documentElement.dataset.theme===t,theme);
                for(const mode of ['word','excel']){
                  await page.locator('#cryptor-tab-'+mode).click();
                  const panel=page.locator('#cryptor-office-'+mode);
                  await panel.locator('[data-ribbon-tab="home"]').click();
                  const gallery=panel.locator('.de-style-gallery');
                  await gallery.waitFor();
                  const tile=gallery.locator('[data-style-tile]').first();
                  const colors=await tile.evaluate(el=>{const c=getComputedStyle(el);return {bg:c.backgroundColor,fg:c.color,chrome:c.getPropertyValue('--de-chrome').trim(),ink:c.getPropertyValue('--de-ink').trim()};});
                  assert.ok(colors.chrome&&colors.ink&&colors.bg!==colors.fg);
                  await page.screenshot({path:path.join(dir,mode+'-'+theme+'-gallery.png')});
                }
                await page.locator('#cryptor-tab-powerpoint').click();
                await page.locator('#cryptor-office-powerpoint').waitFor();
                await page.locator('#cryptor-tab-pdf-editor').click();
                await frame.locator('html[data-theme="'+theme+'"]').waitFor();
                assert.equal(await page.evaluate(()=>localStorage.getItem('bgdev.theme')),theme);
                console.log('PASS all-editor theme '+theme+' and new gallery styling');
              }
              assert.deepEqual(errors,[]);
            }finally{
              await page.screenshot({path:path.join(dir,'last-state.png')}).catch(()=>{});
              await browser.close();
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node "$RUNNER_TEMP/pdf-qa/test.cjs"
