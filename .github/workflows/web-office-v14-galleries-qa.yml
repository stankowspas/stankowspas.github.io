name: Web Office v14 Style Galleries QA (no deployment)
on:
  push:
    branches: [web-office-v14-galleries]
    paths: ['.github/workflows/web-office-v14-galleries-qa.yml','projects/devanagari-cryptor/app-4.4.0.html']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: web-office-v14-galleries-qa
  cancel-in-progress: true
jobs:
  browser:
    if: github.ref == 'refs/heads/web-office-v14-galleries'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install v14 live style galleries (test branch only)
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/web-office-v14-galleries
          python3 - <<'PY'
          from pathlib import Path
          import re,gzip,base64,sys
          host=Path('projects/devanagari-cryptor/app-4.4.0.html');html=host.read_text(encoding='utf-8'); m=next(m for m in re.finditer(r'atob\("([A-Za-z0-9+/=]{10000,})"\)',html) if m[1].startswith('H4sI'));b=gzip.decompress(base64.b64decode(m[1])).decode()
          def one(s,a,c):
              assert s.count(a)==1,(a[:100],s.count(a));return s.replace(a,c,1)
          def edit(mod,fn):
              global b
              a=b.index('"'+mod+'":function');z=b.index('\n},\n',a);b=b[:a]+fn(b[a:z])+b[z:]
          gallery="// Document style previews are intentionally light, like the paper or cells; the gallery chrome follows the host theme.\nfunction StyleGallery({title,items,value,onPick,disabled,more}) {\n    const x=jsx_runtime_1.jsx,xs=jsx_runtime_1.jsxs;\n    return xs('div',{className:'de-style-gallery',role:'group','aria-label':title,style:{display:'flex',alignItems:'center',gap:4,maxWidth:'100%'},children:[x('div',{className:'de-style-gallery-strip',style:{display:'flex',gap:3,overflowX:'auto',maxWidth:'100%',minWidth:0},children:items.map(it=>xs('button',{type:'button',className:'de-style-tile','data-style-tile':it.value,'aria-label':it.label,'aria-pressed':value===it.value,title:it.label,disabled,onMouseDown:e=>e.preventDefault(),onClick:()=>onPick(it.value),style:{flex:'0 0 77px',width:77,minHeight:54,boxSizing:'border-box',background:'var(--de-chrome)',color:'var(--de-ink)',border:'1px solid '+(value===it.value?'var(--de-accent)':'var(--de-border)'),borderRadius:3,padding:3,cursor:disabled?'default':'pointer',display:'flex',flexDirection:'column',justifyContent:'space-between',gap:3},children:[x('span',{style:{display:'block',padding:'3px 2px',fontSize:15,lineHeight:1.2,background:'#fff',color:'#222',overflow:'hidden',whiteSpace:'nowrap',...it.preview},children:'AaBb'}),x('span',{style:{fontSize:10,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',width:'100%'},children:it.label})]},it.value))}),more]});\n}\nexports.StyleGallery=StyleGallery;\n"
          cell="const CELL_GALLERY_NAMES={bg:['Заглавие','Добро','Лошо','Неутрално','Входни данни','Общо'],en:['Heading','Good','Bad','Neutral','Input','Total'],de:['Überschrift','Gut','Schlecht','Neutral','Eingabe','Summe'],fr:['Titre','Bon','Mauvais','Neutre','Saisie','Total'],es:['Título','Bueno','Malo','Neutro','Entrada','Total'],it:['Titolo','Buono','Cattivo','Neutro','Input','Totale'],pt:['Título','Bom','Ruim','Neutro','Entrada','Total'],pl:['Nagłówek','Dobry','Zły','Neutralny','Dane','Suma'],ro:['Antet','Bun','Rău','Neutru','Intrare','Total'],el:['Επικεφαλίδα','Καλό','Κακό','Ουδέτερο','Είσοδος','Σύνολο'],cs:['Nadpis','Dobrý','Špatný','Neutrální','Vstup','Celkem'],hi:['शीर्षक','अच्छा','खराब','तटस्थ','इनपुट','कुल']};\nconst CELL_GALLERY_PRESETS=[{b:true,color:'#FFFFFF',fill:'#4472C4'},{b:false,color:'#006100',fill:'#C6EFCE'},{b:false,color:'#9C0006',fill:'#FFC7CE'},{b:false,color:'#9C6500',fill:'#FFEB9C'},{b:false,color:'#1F4E78',fill:'#DDEBF7'},{b:true,color:'#203864',fill:'#D9E2F3'}];\nfunction CellStyleGallery({onFormat}){\n    const t=strings_1.useStrings();const labels=CELL_GALLERY_NAMES[String(t.locale||'en').split('-')[0]]||CELL_GALLERY_NAMES.en;\n    return jsx_runtime_1.jsx(Toolbar_1.StyleGallery,{title:labels.join(' / '),items:CELL_GALLERY_PRESETS.map((p,i)=>({value:'cell-'+i,label:labels[i],preview:{background:p.fill,color:p.color,fontWeight:p.b?700:400}})),onPick:v=>{const i=Number(v.slice(5));if(CELL_GALLERY_PRESETS[i])onFormat(CELL_GALLERY_PRESETS[i]);}});\n}\n"
          def toolbar(s):
              s=one(s,'function RibbonRow({children,mode}) {',gallery+'function RibbonRow({children,mode}) {')
              s=one(s,' const p=el.props,i=p.icon;',' const p=el.props,i=p.icon;\n if(p.ribbonV14Group==="styles")return "styles";')
              s=one(s,".de-ribbon-group[data-ribbon-group=styles] .de-ribbon-controls{max-width:205px}",".de-ribbon-group[data-ribbon-group=styles] .de-ribbon-controls{max-width:min(515px,calc(100vw - 70px))}.de-style-tile:hover{outline:1px solid var(--de-accent)}.de-style-tile:focus-visible{outline:2px solid var(--de-accent);outline-offset:-2px}")
              return s
          def doc(s):
              a='(0, jsx_runtime_1.jsx)(Toolbar_1.Select, { title: t.docx.style, width: 118, menuWidth: 250, disabled: dis, value: styleValue, placeholder: t.docx.stylePlaceholder, options: styleOpts, onChange: (v) => (v.startsWith(\'@\') ? void editor.applyCanon(v.slice(1)) : editor.setPara({ style: v })) })'
              c='(0, jsx_runtime_1.jsx)(Toolbar_1.StyleGallery, { ribbonV14Group: "styles", title: t.docx.style, disabled: dis, value: styleValue||"@normal", items: styleOpts.slice(0,5).map(o=>({value:o.value,label:o.label,preview:o.style})), onPick: v => (v.startsWith("@") ? void editor.applyCanon(v.slice(1)) : editor.setPara({style:v})), more: '+a+' })'
              return one(s,a,c)
          def xlsx(s):
              s=one(s,'function XlsxToolbar(props) {',cell+'function XlsxToolbar(props) {')
              a='(0, jsx_runtime_1.jsx)(Toolbar_1.Btn, { icon: "clear", title: kb(t.edit.clearFormat,'
              return one(s,a,'(0,jsx_runtime_1.jsx)(CellStyleGallery,{ribbonV14Group:"styles",onFormat:f}), '+a)
          if 'function StyleGallery(' not in b:
              edit('src/react/edit/Toolbar.tsx',toolbar);edit('src/react/docx/DocxToolbar.tsx',doc);edit('src/react/xlsx/XlsxToolbar.tsx',xlsx)
              host.write_text(html[:m.start(1)]+base64.b64encode(gzip.compress(b.encode(),mtime=0)).decode()+html[m.end(1):],encoding='utf-8')
          Path('/tmp/office-v14.js').write_text(b,encoding='utf-8')
          PY
          node --check /tmp/office-v14.js
          git add projects/devanagari-cryptor/app-4.4.0.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Word and Excel visual style galleries using native format commands'
            git push origin HEAD:refs/heads/web-office-v14-galleries
          fi
      - name: Package exact source and single HTML previews
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json, base64, shutil, mimetypes
          root=Path('projects/devanagari-cryptor')
          src=root/'pdf-editor'
          out=Path('pdf-preview')
          out.mkdir()
          raw=src.joinpath('index.html').read_text(encoding='utf-8')
          def data(path):
              mime='font/woff2' if path.suffix=='.woff2' else 'font/ttf'
              return 'data:'+mime+';base64,'+base64.b64encode(path.read_bytes()).decode()
          fonts={p.name:data(p) for p in (src/'fonts').iterdir() if p.is_file()}
          def font_css(css):
              return re.sub(r'fonts/([\w.-]+\.(?:woff2|ttf))',lambda m:fonts.get(m[1],m[0]),css)
          for name in ['styles.css','office-theme.css']:
              raw=raw.replace('<link rel="stylesheet" href="'+name+'">','<style>'+font_css((src/name).read_text(encoding='utf-8'))+'</style>')
          ui=(src/'office-ui.js').read_text(encoding='utf-8')
          ui=ui.replace('new URLSearchParams(location.search)','new URLSearchParams(location.search || window.name)').replace('e.origin!==location.origin','e.origin!==window.origin')
          ui=ui.replace('params.get("lang"):"en"','params.get("lang"):"bg"')
          app=(src/'app.js').read_text(encoding='utf-8')
          app=app.replace("return `fonts/${F.web}-latin-${VARIANT_CSS[v][0]}-${VARIANT_CSS[v][1]}.woff2`;","return previewFonts[`${F.web}-latin-${VARIANT_CSS[v][0]}-${VARIANT_CSS[v][1]}.woff2`];")
          app=app.replace("`fonts/${f}`","previewFonts[f]")
          app='const previewFonts='+json.dumps(fonts,separators=(',',':'))+';\n'+app
          def safe(s): return re.sub(r'</script',r'<\\/script',s,flags=re.I)
          raw=raw.replace('<script defer src="office-ui.js"></script>','<script defer type="module">'+safe(ui)+'</script>')
          raw=raw.replace('<script type="module" src="app.js"></script>','<script type="module">'+safe(app)+'</script>')
          assert 'previewFonts' in raw and 'src="app.js"' not in raw
          (out/'PDF-Editor.html').write_text(raw,encoding='utf-8')
          # Keep the exact original integrated folder for a local HTTP-server review.
          folder=out/'Web-Office-original'
          folder.mkdir()
          shutil.copy2(root/'app-4.4.0.html',folder/'app-4.4.0.html')
          shutil.copytree(src,folder/'pdf-editor')
          main=(root/'app-4.4.0.html').read_text(encoding='utf-8')
          bridge=(src/'bridge.js').read_text(encoding='utf-8')
          bridge=bridge.replace('postMessage(settings(),location.origin)','postMessage(settings(),window.origin==="null"?"*":window.origin)')
          enc=base64.b64encode(raw.encode()).decode()
          bridge=bridge.replace('frame.src=url.href;','frame.name=url.searchParams.toString();frame.srcdoc=new TextDecoder().decode(Uint8Array.from(atob("'+enc+'"),c=>c.charCodeAt(0)));')
          assert 'frame.srcdoc=' in bridge
          pattern=r'<script\b[^>]*\bsrc\s*=\s*["\'](?:\./)?pdf-editor/bridge\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script\s*>'
          main,count=re.subn(pattern,lambda m:'<script>'+safe(bridge)+'</script>',main,flags=re.I)
          if count==1:
              (out/'Web-Office-PDF-Editor.html').write_text(main,encoding='utf-8')
          else:
              print('Integrated standalone not generated: bridge tag match count',count)
          (out/'README.txt').write_text('Preview only; not deployed. Open PDF-Editor.html or Web-Office-PDF-Editor.html in Chrome/Edge. Internet is required for CDN PDF engines. For the exact unmodified source folder, run python -m http.server 8765 inside Web-Office-original and open http://localhost:8765/app-4.4.0.html. Standalone packaging is for review only, not a production release.\n',encoding='utf-8')
          shutil.copy2(src/'LICENSE',out/'LICENSE')
          print([(p.name,p.stat().st_size) for p in out.glob('*.html')])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Web-Office-v14-Style-Galleries-preview
          path: pdf-preview/
          retention-days: 14
      - name: Prepare browser
        run: |
          npm install --prefix "$RUNNER_TEMP/pdf-qa" playwright@1.51.1 --no-audit --no-fund
          "$RUNNER_TEMP/pdf-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test actual local Web Office in Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pdf-qa/results"
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/pdf-qa/server.log" 2>&1 &
          cat > "$RUNNER_TEMP/pdf-qa/test.cjs" <<'JS'
