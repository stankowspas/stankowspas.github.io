            const page=await browser.newPage({viewport:{width:1440,height:1000},acceptDownloads:true});
            const errors=[];
            page.on('pageerror',e=>{errors.push(e.message);console.log('PAGE ERROR',e.message)});
            page.on('dialog',d=>d.accept());
            const dir=path.join(__dirname,'results');
            const base='http://127.0.0.1:8765/projects/devanagari-cryptor/';
            try{
              await page.goto(base+'app-4.4.0.html',{waitUntil:'domcontentloaded'});
              await page.locator('#cryptor-tab-pdf-editor').waitFor({timeout:30000});
              const mode=page.locator('#modeSelect');
              const original=await mode.inputValue();
              await page.locator('#langSelect').selectOption('bg');
              await page.locator('#cryptor-tab-pdf-editor').click();
              await page.locator('#cryptor-office-pdf-editor iframe').waitFor();
              const frame=page.frameLocator('#cryptor-office-pdf-editor iframe');
              await frame.locator('#btnSample').waitFor();
              await page.screenshot({path:path.join(dir,'01-office-editor-bg.png')});
              assert.equal(await frame.locator('html').getAttribute('lang'),'bg');
              assert.equal(await page.locator('#cryptorOffice > #cryptor-office-pdf-editor').count(),1);
              const section=page.locator('#cryptor-office-pdf-editor');
              await section.locator('.cryptor-office-expand').click();
              await page.waitForFunction(()=>document.documentElement.hasAttribute('data-office-expanded'));
              await section.locator('.cryptor-office-expand').click();
              await page.waitForFunction(()=>!document.documentElement.hasAttribute('data-office-expanded'));
              console.log('PASS common Office expand/restore');
              await section.locator('.cryptor-office-fullscreen').click();
              await page.waitForFunction(()=>document.fullscreenElement?.id==='cryptor-office-pdf-editor');
              await section.locator('.cryptor-office-fullscreen').click();
              await page.waitForFunction(()=>!document.fullscreenElement);
              console.log('PASS common Office full screen and exit');
              console.log('PASS office integration / Bulgarian language');
              await frame.locator('#btnSample').click();
              await frame.locator('#editor').waitFor({timeout:60000});
              await frame.locator('#pagesWrap .page canvas').first().waitFor({timeout:30000});
              assert.equal(await frame.locator('#pagesWrap .page').count(),2);
              console.log('PASS PDF sample open and render');
              for(const [kind,expected] of [['word',['home','insert','layout','references','review','view','all']],['excel',['home','insert','cells','formulas','data','view','all']]]){
                await page.locator('#cryptor-tab-'+kind).click();
                const panel=page.locator('#cryptor-office-'+kind);
                await panel.locator('.de-office-ribbon').waitFor({timeout:30000});
                const tabs=panel.locator('.de-office-ribbon-tab');
                const actual=await tabs.evaluateAll(els=>els.map(e=>e.dataset.ribbonTab));
                assert.deepEqual(kind==='excel'?actual.filter(k=>k!=='review'):actual,expected);
                if(kind==='excel'&&actual.includes('review'))expected.splice(expected.indexOf('view'),0,'review');
                for(const key of expected){
                  const tab=panel.locator('[data-ribbon-tab="'+key+'"]');
                  await tab.click();
                  assert.equal(await tab.getAttribute('aria-pressed'),'true');
                  assert.ok(await panel.locator('.de-ebar > .de-ebar-it').count()>0,kind+' '+key+' is empty');
                }
                await panel.locator('[data-ribbon-tab="home"]').click();
                assert.equal(await panel.locator('[data-ribbon-tab="home"]').textContent(),'Начало');
                await page.screenshot({path:path.join(dir,kind+'-v7.png')});
                await panel.locator('.cryptor-office-ribbon-toggle').click();
                await panel.locator('.de-office-ribbon').waitFor({state:'hidden'});
                await panel.locator('.cryptor-office-ribbon-toggle').click();
                await panel.locator('.de-office-ribbon').waitFor();
                console.log('PASS '+kind+' six actual ribbon tabs, nonempty tools, Bulgarian labels, collapse/restore');
              }
              await page.locator('#langSelect').selectOption('en');
              assert.equal(await page.locator('#cryptor-office-excel [data-ribbon-tab="home"]').textContent(),'Home');
              // Actual document edits: exercise the original engine through the new ribbon.
              await page.locator('#cryptor-tab-word').click();
              const word=page.locator('#cryptor-office-word');
              const doc=word.locator('.de-pages[contenteditable="true"]');
              await doc.locator('.de-p').first().waitFor({timeout:30000});
              await doc.locator('.de-p').first().click();
              await page.keyboard.type('RibbonQAWord');
