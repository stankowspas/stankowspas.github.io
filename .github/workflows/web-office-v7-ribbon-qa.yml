              assert.equal(await frame.locator('#pagesWrap .page').count(),3);
              await frame.locator('#thumbs .thumb').last().locator('[data-op="rot"]').click({force:true});
              const f=page.frames().find(f=>f.url().includes('/pdf-editor/index.html'));
              assert.equal(await f.evaluate(()=>window.__pdfStudio.S.pages.at(-1).rot),90);
              await frame.locator('#thumbs .thumb').last().locator('[data-op="up"]').click({force:true});
              assert.equal(await f.evaluate(()=>window.__pdfStudio.S.pages[1].src),-1);
              await frame.locator('#thumbs .thumb').nth(1).locator('[data-op="del"]').click({force:true});
              assert.equal(await frame.locator('#pagesWrap .page').count(),2);
              console.log('PASS add/rotate/reorder/delete page');
              await page.screenshot({path:path.join(dir,'02-edited-document-bg.png')});
              const pending=page.waitForEvent('download',{timeout:30000});
              await frame.locator('#btnDownload').click();
              const download=await pending;
              const pdf=path.join(dir,'qa-output.pdf');
              await download.saveAs(pdf);
              assert.equal(fs.readFileSync(pdf).subarray(0,5).toString(),'%PDF-');
              const bytes=Array.from(fs.readFileSync(pdf));
              await f.evaluate(async b=>{const d=await PDFLib.PDFDocument.load(new Uint8Array(b));if(d.getPageCount()!==2)throw Error('Invalid exported page count')},bytes);
              console.log('PASS download and parse exported PDF');
              if(original && original!=='pdf-editor'){
                await page.locator('#cryptor-tab-word').click();
                await page.locator('#cryptor-office-word').waitFor();
                await page.locator('#cryptor-tab-excel').click();
                await page.locator('#cryptor-office-excel').waitFor();
                await page.locator('#cryptor-office-pdf-editor').waitFor({state:'hidden'});
                await page.locator('#cryptor-tab-pdf-editor').click();
                await frame.locator('#editor').waitFor();
                assert.equal(await frame.locator('.obj.text').count(),1);
                console.log('PASS tab switching retains document');
              }
              assert.deepEqual(errors,[]);
            }finally{
              await page.screenshot({path:path.join(dir,'last-state.png')}).catch(()=>{});
              await browser.close();
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
