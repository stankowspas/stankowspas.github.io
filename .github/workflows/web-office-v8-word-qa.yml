name: Web Office v8 Word QA (no deployment)
on:
  push:
    branches: [web-office-v8-word]
    paths: ['.github/workflows/web-office-v8-word-qa.yml','projects/devanagari-cryptor/app-4.4.0.html']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: web-office-v8-word-qa
  cancel-in-progress: true
jobs:
  browser:
    if: github.ref == 'refs/heads/web-office-v8-word'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Word v8 review tools (test branch only)
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/web-office-v8-word
          python3 - <<'PY'
          from pathlib import Path
          import sys,re,base64,gzip
          host=Path('projects/devanagari-cryptor/app-4.4.0.html'); s=host.read_text(encoding='utf-8'); m=next(m for m in re.finditer(r'atob\("([A-Za-z0-9+/=]{10000,})"\)',s) if m[1].startswith('H4sI')); b=gzip.decompress(base64.b64decode(m[1])).decode()
          def one(s,a,b):
              assert s.count(a)==1,(a[:120],s.count(a));return s.replace(a,b,1)
          def edit(mod,fn):
              global b
              a=b.index('"'+mod+'":function');z=b.index('\n},\n',a); b=b[:a]+fn(b[a:z])+b[z:]
          def toolbar(s):
              return one(s,'    const p=el.props, icon=p.icon;','    const p=el.props, icon=p.icon;\n    if (mode === "word" && p.ribbonGroup === "review") return "review";')
          def wordtoolbar(s):
              labels="""const WORD_PROOF_LABELS={bg:'Правопис (браузър)',en:'Spell check (browser)',de:'Rechtschreibung (Browser)',fr:'Orthographe (navigateur)',es:'Ortografía (navegador)',it:'Ortografia (browser)',pt:'Ortografia (navegador)',pl:'Pisownia (przeglądarka)',ro:'Ortografie (browser)',el:'Ορθογραφία (πρόγραμμα περιήγησης)',cs:'Pravopis (prohlížeč)',hi:'वर्तनी जाँच (ब्राउज़र)'};
          """
              s=one(s,'function DocxToolbar(props) {',labels+'function DocxToolbar(props) {')
              a='(0, jsx_runtime_1.jsx)(Toolbar_1.Btn, { icon: "track",'
              new="""(0, jsx_runtime_1.jsx)(Toolbar_1.Btn, { ribbonGroup: "review", title: WORD_PROOF_LABELS[String(t.locale || 'en').split('-')[0]] || WORD_PROOF_LABELS.en, label: WORD_PROOF_LABELS[String(t.locale || 'en').split('-')[0]] || WORD_PROOF_LABELS.en, wide: true, active: props.spellCheck, onClick: props.onSpellCheck }), (0, jsx_runtime_1.jsx)(Toolbar_1.Btn, { ribbonGroup: "review", title: t.docx.words, label: t.docx.words, wide: true, onClick: props.onStats }), """
              return one(s,a,new+a)
          def view(s):
              s=one(s,'const Dialog_1 = require("src/react/common/Dialog.tsx");','const Dialog_1 = require("src/react/common/Dialog.tsx");\nconst word_ui_1 = require("src/react/ui.tsx");')
              a='    const [outline, setOutline] = (0, react_1.useState)(false);'
              s=one(s,a,a+"""
              const [proof, setProof] = (0, react_1.useState)(false);
              const [showStats, setShowStats] = (0, react_1.useState)(false);
              const StatsDialog = (0, word_ui_1.useHostUI)().Dialog ?? word_ui_1.DefaultDialog;""")
              s=one(s,'suppressContentEditableWarning: true, spellCheck: false,','suppressContentEditableWarning: true, spellCheck: isEditing && proof, lang: str.locale,')
              s=one(s,'outline && !headless && ((0, jsx_runtime_1.jsxs)("nav",','outline && ((0, jsx_runtime_1.jsxs)("nav",')
              s=one(s,'onOutline: headless ? undefined : () => setOutline((o) => !o),','onOutline: () => setOutline((o) => !o), spellCheck: proof, onSpellCheck: () => setProof((p) => !p), onStats: () => setShowStats(true),')
              a=s.index('        stats: () => {');z=s.index('\n        },\n    });',a)+len('\n        },')
              stat=s[a:z];helper=stat.replace('        stats: () => {','    const documentStats = () => {',1).removesuffix(',')+';\n'
              helper=one(helper,'            let chars = 0;','            let chars = 0, countWords = 0;')
              helper=one(helper,'                    chars += t.length;','                    chars += t.length;\n                    countWords += shownText(b).split(/\\s+/).filter(w => /[\\p{L}\\p{N}]/u.test(w)).length;')
              helper=one(helper,'(str, words) + more','(str, countWords) + more')
              s=s[:a]+'        stats: documentStats,'+s[z:]
              s=one(s,'    // ---- File → Download as / Print: the pages as laid out on screen ----',helper+'    // ---- File → Download as / Print: the pages as laid out on screen ----')
              a='toast && (0, jsx_runtime_1.jsx)(Dialog_1.Toast, { text: toast, onDone: () => setToast(null) })'
              modal="""showStats && (0, jsx_runtime_1.jsx)(StatsDialog, { title: str.docx.words, onClose: () => setShowStats(false), actions: [{label: str.common.ok, primary: true, onClick: () => setShowStats(false)}], children: (0, jsx_runtime_1.jsx)("dl", {className: "de-word-statistics", style: {display:"grid",gridTemplateColumns:"1fr auto",gap:"8px 24px",margin:"8px 0"}, children: documentStats().map(([label,value]) => (0, jsx_runtime_1.jsxs)(react_1.Fragment, {children: [(0, jsx_runtime_1.jsx)("dt",{children:label}), (0, jsx_runtime_1.jsx)("dd",{style:{margin:0,textAlign:"right"},children:value})]}, label))}) }), """
              return one(s,a,modal+a)
          if 'WORD_PROOF_LABELS' not in b:
              edit('src/react/edit/Toolbar.tsx',toolbar);edit('src/react/docx/DocxToolbar.tsx',wordtoolbar);edit('src/react/docx/DocxView.tsx',view)
              host.write_text(s[:m.start(1)]+base64.b64encode(gzip.compress(b.encode(),mtime=0)).decode()+s[m.end(1):],encoding='utf-8')
          Path('/tmp/office-v8.js').write_text(b,encoding='utf-8')
          PY
          node --check /tmp/office-v8.js
          git add projects/devanagari-cryptor/app-4.4.0.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Word v8: browser proofing, document statistics and heading navigation'
            git push origin HEAD:refs/heads/web-office-v8-word
          fi
      - name: Package exact source and single HTML previews
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json, base64, shutil, mimetypes
          root=Path('projects/devanagari-cryptor')
          src=root/'pdf-editor'
          out=Path('pdf-preview')
          out.mkdir()
          raw=src.joinpath('index.html').read_text(encoding='utf-8')
          def data(path):
              mime='font/woff2' if path.suffix=='.woff2' else 'font/ttf'
              return 'data:'+mime+';base64,'+base64.b64encode(path.read_bytes()).decode()
          fonts={p.name:data(p) for p in (src/'fonts').iterdir() if p.is_file()}
          def font_css(css):
              return re.sub(r'fonts/([\w.-]+\.(?:woff2|ttf))',lambda m:fonts.get(m[1],m[0]),css)
          for name in ['styles.css','office-theme.css']:
              raw=raw.replace('<link rel="stylesheet" href="'+name+'">','<style>'+font_css((src/name).read_text(encoding='utf-8'))+'</style>')
          ui=(src/'office-ui.js').read_text(encoding='utf-8')
          ui=ui.replace('new URLSearchParams(location.search)','new URLSearchParams(location.search || window.name)').replace('e.origin!==location.origin','e.origin!==window.origin')
          ui=ui.replace('params.get("lang"):"en"','params.get("lang"):"bg"')
          app=(src/'app.js').read_text(encoding='utf-8')
          app=app.replace("return `fonts/${F.web}-latin-${VARIANT_CSS[v][0]}-${VARIANT_CSS[v][1]}.woff2`;","return previewFonts[`${F.web}-latin-${VARIANT_CSS[v][0]}-${VARIANT_CSS[v][1]}.woff2`];")
          app=app.replace("`fonts/${f}`","previewFonts[f]")
          app='const previewFonts='+json.dumps(fonts,separators=(',',':'))+';\n'+app
          def safe(s): return re.sub(r'</script',r'<\\/script',s,flags=re.I)
          raw=raw.replace('<script defer src="office-ui.js"></script>','<script defer type="module">'+safe(ui)+'</script>')
          raw=raw.replace('<script type="module" src="app.js"></script>','<script type="module">'+safe(app)+'</script>')
          assert 'previewFonts' in raw and 'src="app.js"' not in raw
          (out/'PDF-Editor.html').write_text(raw,encoding='utf-8')
          # Keep the exact original integrated folder for a local HTTP-server review.
          folder=out/'Web-Office-original'
          folder.mkdir()
          shutil.copy2(root/'app-4.4.0.html',folder/'app-4.4.0.html')
          shutil.copytree(src,folder/'pdf-editor')
          main=(root/'app-4.4.0.html').read_text(encoding='utf-8')
          bridge=(src/'bridge.js').read_text(encoding='utf-8')
          bridge=bridge.replace('postMessage(settings(),location.origin)','postMessage(settings(),window.origin==="null"?"*":window.origin)')
          enc=base64.b64encode(raw.encode()).decode()
          bridge=bridge.replace('frame.src=url.href;','frame.name=url.searchParams.toString();frame.srcdoc=new TextDecoder().decode(Uint8Array.from(atob("'+enc+'"),c=>c.charCodeAt(0)));')
          assert 'frame.srcdoc=' in bridge
          pattern=r'<script\b[^>]*\bsrc\s*=\s*["\'](?:\./)?pdf-editor/bridge\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script\s*>'
          main,count=re.subn(pattern,lambda m:'<script>'+safe(bridge)+'</script>',main,flags=re.I)
          if count==1:
              (out/'Web-Office-PDF-Editor.html').write_text(main,encoding='utf-8')
          else:
              print('Integrated standalone not generated: bridge tag match count',count)
          (out/'README.txt').write_text('Preview only; not deployed. Open PDF-Editor.html or Web-Office-PDF-Editor.html in Chrome/Edge. Internet is required for CDN PDF engines. For the exact unmodified source folder, run python -m http.server 8765 inside Web-Office-original and open http://localhost:8765/app-4.4.0.html. Standalone packaging is for review only, not a production release.\n',encoding='utf-8')
          shutil.copy2(src/'LICENSE',out/'LICENSE')
          print([(p.name,p.stat().st_size) for p in out.glob('*.html')])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Web-Office-v8-Word-preview
          path: pdf-preview/
          retention-days: 14
      - name: Prepare browser
        run: |
          npm install --prefix "$RUNNER_TEMP/pdf-qa" playwright@1.51.1 --no-audit --no-fund
          "$RUNNER_TEMP/pdf-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test actual local Web Office in Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pdf-qa/results"
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/pdf-qa/server.log" 2>&1 &
          cat > "$RUNNER_TEMP/pdf-qa/test.cjs" <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000},acceptDownloads:true});
            const errors=[];
            page.on('pageerror',e=>{errors.push(e.message);console.log('PAGE ERROR',e.message)});
            page.on('dialog',d=>d.accept());
            const dir=path.join(__dirname,'results');
            const base='http://127.0.0.1:8765/projects/devanagari-cryptor/';
            try{
              await page.goto(base+'app-4.4.0.html',{waitUntil:'domcontentloaded'});
              await page.locator('#cryptor-tab-pdf-editor').waitFor({timeout:30000});
              const mode=page.locator('#modeSelect');
              const original=await mode.inputValue();
              await page.locator('#langSelect').selectOption('bg');
              await page.locator('#cryptor-tab-pdf-editor').click();
              await page.locator('#cryptor-office-pdf-editor iframe').waitFor();
              const frame=page.frameLocator('#cryptor-office-pdf-editor iframe');
              await frame.locator('#btnSample').waitFor();
              await page.screenshot({path:path.join(dir,'01-office-editor-bg.png')});
              assert.equal(await frame.locator('html').getAttribute('lang'),'bg');
              assert.equal(await page.locator('#cryptorOffice > #cryptor-office-pdf-editor').count(),1);
              const section=page.locator('#cryptor-office-pdf-editor');
              await section.locator('.cryptor-office-expand').click();
              await page.waitForFunction(()=>document.documentElement.hasAttribute('data-office-expanded'));
              await section.locator('.cryptor-office-expand').click();
              await page.waitForFunction(()=>!document.documentElement.hasAttribute('data-office-expanded'));
              console.log('PASS common Office expand/restore');
              await section.locator('.cryptor-office-fullscreen').click();
              await page.waitForFunction(()=>document.fullscreenElement?.id==='cryptor-office-pdf-editor');
              await section.locator('.cryptor-office-fullscreen').click();
              await page.waitForFunction(()=>!document.fullscreenElement);
              console.log('PASS common Office full screen and exit');
              console.log('PASS office integration / Bulgarian language');
              await frame.locator('#btnSample').click();
              await frame.locator('#editor').waitFor({timeout:60000});
              await frame.locator('#pagesWrap .page canvas').first().waitFor({timeout:30000});
              assert.equal(await frame.locator('#pagesWrap .page').count(),2);
              console.log('PASS PDF sample open and render');
              for(const [kind,expected] of [['word',['home','insert','layout','review','view','all']],['excel',['home','cells','formulas','data','view','all']]]){
                await page.locator('#cryptor-tab-'+kind).click();
                const panel=page.locator('#cryptor-office-'+kind);
                await panel.locator('.de-office-ribbon').waitFor({timeout:30000});
                const tabs=panel.locator('.de-office-ribbon-tab');
                assert.deepEqual(await tabs.evaluateAll(els=>els.map(e=>e.dataset.ribbonTab)),expected);
                for(const key of expected){
                  const tab=panel.locator('[data-ribbon-tab="'+key+'"]');
                  await tab.click();
                  assert.equal(await tab.getAttribute('aria-pressed'),'true');
                  assert.ok(await panel.locator('.de-ebar > .de-ebar-it').count()>0,kind+' '+key+' is empty');
                }
                await panel.locator('[data-ribbon-tab="home"]').click();
                assert.equal(await panel.locator('[data-ribbon-tab="home"]').textContent(),'Начало');
                await page.screenshot({path:path.join(dir,kind+'-v7.png')});
                await panel.locator('.cryptor-office-ribbon-toggle').click();
                await panel.locator('.de-office-ribbon').waitFor({state:'hidden'});
                await panel.locator('.cryptor-office-ribbon-toggle').click();
                await panel.locator('.de-office-ribbon').waitFor();
                console.log('PASS '+kind+' six actual ribbon tabs, nonempty tools, Bulgarian labels, collapse/restore');
              }
              await page.locator('#langSelect').selectOption('en');
              assert.equal(await page.locator('#cryptor-office-excel [data-ribbon-tab="home"]').textContent(),'Home');
              // Actual document edits: exercise the original engine through the new ribbon.
              await page.locator('#cryptor-tab-word').click();
              const word=page.locator('#cryptor-office-word');
              const doc=word.locator('.de-pages[contenteditable="true"]');
              await doc.locator('.de-p').first().waitFor({timeout:30000});
              await doc.locator('.de-p').first().click();
              await page.keyboard.type('RibbonQAWord');
              await doc.getByText('RibbonQAWord',{exact:true}).waitFor();
              await page.keyboard.press('Shift+Home');
              await word.locator('[data-ribbon-tab="home"]').click();
              const bold=word.locator('.de-ebar button[title^="Bold"]').first();
              await bold.click();
              await page.waitForFunction(()=>{
                const panel=document.querySelector('#cryptor-office-word');
                const walk=root=>{for(const e of root.querySelectorAll('*')){if(e.shadowRoot&&walk(e.shadowRoot))return true;if(e.textContent==='RibbonQAWord'&&Number(getComputedStyle(e).fontWeight)>=600)return true}return false};
                return walk(panel);
              });
              await word.locator('[data-ribbon-tab="insert"]').click();
              await word.locator('[data-ribbon-tab="all"]').click();
              assert.ok(await doc.getByText('RibbonQAWord',{exact:true}).count());
              console.log('PASS Word input and bold through Home ribbon, text retained across menus');
              await word.locator('[data-ribbon-tab="review"]').click();
              const proof=word.getByRole('button',{name:'Spell check (browser)',exact:true});
              await proof.click();
              assert.equal(await doc.getAttribute('spellcheck'),'true');
              assert.ok((await doc.getAttribute('lang')).startsWith('en'));
              await proof.click();
              assert.equal(await doc.getAttribute('spellcheck'),'false');
              console.log('PASS Word browser proofing toggle and document language');
              await word.locator('.de-ebar button[title="Words"]').click();
              const stats=word.locator('.de-word-statistics');
              await stats.waitFor();
              const values=await stats.locator('dd').allTextContents();
              assert.equal(values[1],'1');
              assert.equal(values[2],'12');
              await page.keyboard.press('Escape');
              await stats.waitFor({state:'hidden'});
              console.log('PASS Word document statistics (1 word, 12 characters)');
              await word.locator('[data-ribbon-tab="view"]').click();
              await word.locator('.de-ebar button').first().click();
              await word.locator('.de-outline').waitFor();
              await word.locator('.de-outline-head button').click();
              await word.locator('.de-outline').waitFor({state:'hidden'});
              console.log('PASS Word heading navigation opens and closes');

              await page.locator('#cryptor-tab-excel').click();
              const sheet=page.locator('#cryptor-office-excel');
              const fx=sheet.locator('.de-fx-input');
              await fx.waitFor({timeout:30000});
              await fx.click();
              await fx.fill('=SUM(12,30)');
              await fx.press('Enter');
              await sheet.locator('.de-cell').getByText('42',{exact:true}).first().waitFor({timeout:15000});
              await sheet.locator('[data-ribbon-tab="formulas"]').click();
              await sheet.locator('[data-ribbon-tab="data"]').click();
              await sheet.locator('[data-ribbon-tab="all"]').click();
              await sheet.locator('.de-cell').getByText('42',{exact:true}).first().waitFor();
              console.log('PASS Excel formula SUM(12,30)=42, result retained across menus');

              await page.locator('#langSelect').selectOption('bg');
              await page.locator('#cryptor-tab-powerpoint').click();
              const ppt=page.locator('#cryptor-office-powerpoint');
              await ppt.locator('.de-ebar').waitFor();
              assert.equal(await ppt.locator('.de-office-ribbon').count(),0);
              await page.locator('#cryptor-tab-pdf-editor').click();
              await frame.locator('#editor').waitFor();
              console.log('PASS language switch and unchanged PowerPoint/PDF editor');

              const themes=page.locator('#themeSelect');
              assert.equal(await themes.locator('option').count(),6);
              for (const [theme,accent] of [['black-platinum','#a5a5a5'],['black-gold','#c5ae60']]) {
                await themes.selectOption(theme);
                await page.waitForFunction(t=>document.documentElement.dataset.theme===t,theme);
                await frame.locator('html[data-theme="'+theme+'"]').waitFor();
                assert.equal(await page.evaluate(()=>getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()),accent);
                assert.equal(await frame.locator('html').evaluate(el=>getComputedStyle(el).getPropertyValue('--accent').trim()),accent);
                assert.equal(await frame.locator('.page').first().evaluate(el=>getComputedStyle(el).backgroundColor),'rgb(255, 255, 255)');
                for(const mode of ['word','excel','powerpoint']){
                  await page.locator('#cryptor-tab-'+mode).click();
                  await page.locator('#cryptor-office-'+mode).waitFor();
                  assert.equal(await page.evaluate(()=>getComputedStyle(document.documentElement).getPropertyValue('--page').trim()),'#090909');
                }
                await page.locator('#cryptor-tab-pdf-editor').click();
                await frame.locator('#editor').waitFor();
                assert.equal(await frame.locator('#pagesWrap .page').count(),2);
                assert.equal(await page.evaluate(()=>localStorage.getItem('bgdev.theme')),theme);
                await page.screenshot({path:path.join(dir,theme+'.png')});
                console.log('PASS '+theme+' host, Office tabs, PDF, saved setting, unchanged page');
              }
              await themes.selectOption('dark');
              await frame.locator('html[data-theme="dark"]').waitFor();

              const pdfFrame=page.frames().find(f=>f.url().includes('/pdf-editor/index.html'));
              const sample=Buffer.from(await pdfFrame.evaluate(async()=>Array.from(await window.__pdfStudio.makeSample())));
              await frame.locator('#fileMergePdf').setInputFiles([{name:'first.pdf',mimeType:'application/pdf',buffer:sample},{name:'second.pdf',mimeType:'application/pdf',buffer:sample}]);
              await frame.locator('#pagesWrap .page').nth(3).waitFor({timeout:30000});
              assert.equal(await frame.locator('#pagesWrap .page').count(),4);
              console.log('PASS merge two two-page PDF files');
              await frame.locator('#btnRotateLeft').click();
              assert.equal(await pdfFrame.evaluate(()=>window.__pdfStudio.S.pages[0].rot),270);
              await frame.locator('#btnRotateRight').click();
              assert.equal(await pdfFrame.evaluate(()=>window.__pdfStudio.S.pages[0].rot),0);
              console.log('PASS rotate left and right');
              const splitPending=page.waitForEvent('download',{timeout:30000});
              await frame.locator('#btnSplitPdf').click();
              const splitDownload=await splitPending;
              const zipPath=path.join(dir,'split-pages.zip');
              await splitDownload.saveAs(zipPath);
              const z=fs.readFileSync(zipPath);
              let off=0,count=0;
              while(z.readUInt32LE(off)===0x04034b50){
                const sz=z.readUInt32LE(off+18),start=off+30+z.readUInt16LE(off+26)+z.readUInt16LE(off+28);
                const data=Array.from(z.subarray(start,start+sz));
                await pdfFrame.evaluate(async b=>{const d=await PDFLib.PDFDocument.load(new Uint8Array(b));if(d.getPageCount()!==1)throw Error('Split output is not one page')},data);
                off=start+sz;count++;
              }
              assert.equal(count,4);
              console.log('PASS split ZIP with four valid individual PDFs');
              await pdfFrame.evaluate(async()=>window.__pdfStudio.openBytes(await window.__pdfStudio.makeSample(),'sample-invoice.pdf'));
              await frame.locator('#pagesWrap .page').nth(1).waitFor();
              assert.equal(await frame.locator('#pagesWrap .page').count(),2);

              const tools=await frame.locator('#tools').boundingBox();
              const viewer=await frame.locator('#viewer').boundingBox();
              assert.ok(tools.width>viewer.width && tools.y<viewer.y,'Tools must be a horizontal ribbon above the workspace');
              await section.locator('.cryptor-office-ribbon-toggle').click();
              await frame.locator('#tools').waitFor({state:'hidden'});
              await section.locator('.cryptor-office-ribbon-toggle').click();
              await frame.locator('#tools').waitFor();
              console.log('PASS shared ribbon collapse/restore');
              await frame.locator('[data-tool="text"]').click();
              await frame.locator('#pagesWrap .layer').first().click({position:{x:120,y:120}});
              await frame.locator('.tcontent[contenteditable="plaintext-only"], .tcontent[contenteditable="true"]').fill('PDF QA test');
              await frame.locator('[data-tool="select"]').click();
              assert.equal(await frame.locator('.obj.text').count(),1);
              await frame.locator('#btnUndo').click();
              assert.equal(await frame.locator('.obj.text').count(),0);
              await frame.locator('#btnRedo').click();
              assert.equal(await frame.locator('.obj.text').count(),1);
              console.log('PASS add text and undo/redo');
              await frame.locator('#btnAddPage').click();
              assert.equal(await frame.locator('#pagesWrap .page').count(),3);
              await frame.locator('#thumbs .thumb').last().locator('[data-op="rot"]').click({force:true});
              const f=page.frames().find(f=>f.url().includes('/pdf-editor/index.html'));
              assert.equal(await f.evaluate(()=>window.__pdfStudio.S.pages.at(-1).rot),90);
              await frame.locator('#thumbs .thumb').last().locator('[data-op="up"]').click({force:true});
              assert.equal(await f.evaluate(()=>window.__pdfStudio.S.pages[1].src),-1);
              await frame.locator('#thumbs .thumb').nth(1).locator('[data-op="del"]').click({force:true});
              assert.equal(await frame.locator('#pagesWrap .page').count(),2);
              console.log('PASS add/rotate/reorder/delete page');
              await page.screenshot({path:path.join(dir,'02-edited-document-bg.png')});
              const pending=page.waitForEvent('download',{timeout:30000});
              await frame.locator('#btnDownload').click();
              const download=await pending;
              const pdf=path.join(dir,'qa-output.pdf');
              await download.saveAs(pdf);
              assert.equal(fs.readFileSync(pdf).subarray(0,5).toString(),'%PDF-');
              const bytes=Array.from(fs.readFileSync(pdf));
              await f.evaluate(async b=>{const d=await PDFLib.PDFDocument.load(new Uint8Array(b));if(d.getPageCount()!==2)throw Error('Invalid exported page count')},bytes);
              console.log('PASS download and parse exported PDF');
              if(original && original!=='pdf-editor'){
                await page.locator('#cryptor-tab-word').click();
                await page.locator('#cryptor-office-word').waitFor();
                await page.locator('#cryptor-tab-excel').click();
                await page.locator('#cryptor-office-excel').waitFor();
                await page.locator('#cryptor-office-pdf-editor').waitFor({state:'hidden'});
                await page.locator('#cryptor-tab-pdf-editor').click();
                await frame.locator('#editor').waitFor();
                assert.equal(await frame.locator('.obj.text').count(),1);
                console.log('PASS tab switching retains document');
              }
              assert.deepEqual(errors,[]);
            }finally{
              await page.screenshot({path:path.join(dir,'last-state.png')}).catch(()=>{});
              await browser.close();
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
