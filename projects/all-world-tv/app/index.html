<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>All-World TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
:root{--bg:#05070a;--glass:rgba(10,14,20,.45);--line:rgba(255,255,255,.10);--text:#f4f7fb;--muted:#a9b3c2;--accent:#5ae0b0;--accent2:#6ea8ff;--danger:#ff6b6b}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}body{font-family:Inter,system-ui,"Segoe UI",sans-serif;color:var(--text)}
button,input,select{font:inherit}.app{position:fixed;inset:0;background:#000}.player-shell{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000}video{width:100%;height:100%;object-fit:contain;background:#000}
.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 10%,rgba(90,224,176,.10),transparent 30rem),radial-gradient(circle at 90% 85%,rgba(110,168,255,.08),transparent 30rem)}
.topbar{position:absolute;left:0;right:0;top:0;padding:14px 16px;z-index:20;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.42),transparent)}
.brand-stack{display:flex;flex-direction:column;align-items:flex-start;gap:8px}.brand{pointer-events:auto;display:flex;align-items:center;gap:10px}.mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,var(--accent),#31896e);display:grid;place-items:center;color:#06110d;font-weight:900}.brand h1{margin:0;font-size:16px}.brand small{color:#c3ccd8}
.menu{pointer-events:auto;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);color:var(--text);border-radius:12px;padding:8px 11px;cursor:pointer}
.drawer{position:absolute;left:12px;top:105px;bottom:12px;width:min(330px,calc(100vw - 24px));z-index:30;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:rgba(10,14,20,.62);backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,.36);transition:.24s}
.drawer.closed{transform:translateX(calc(-100% - 22px));opacity:0;pointer-events:none}.drawer-head{padding:12px;border-bottom:1px solid rgba(255,255,255,.07)}.drawer-title{display:flex;justify-content:space-between;gap:10px;margin-bottom:9px}.count{font-size:11px;color:var(--accent)}
.controls{display:grid;gap:7px}.control{width:100%;border:1px solid var(--line);background:rgba(15,21,30,.78);color:var(--text);border-radius:11px;padding:9px 10px;outline:none}.control option{background:#121823;color:#fff}
.list{flex:1;min-height:0;overflow-y:auto;padding:8px}.channel{width:100%;display:grid;grid-template-columns:10px 42px 1fr;gap:9px;align-items:center;border:1px solid transparent;background:transparent;color:inherit;text-align:left;border-radius:12px;padding:7px;cursor:pointer}.channel:hover{background:rgba(255,255,255,.075)}.channel.active{background:rgba(90,224,176,.12);border-color:rgba(90,224,176,.26)}
.logo,.fallback{width:42px;height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.09);background:rgba(0,0,0,.3)}.logo{object-fit:contain;padding:4px}.fallback{display:grid;place-items:center;font-size:11px;font-weight:800}.name{font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.country{font-size:10px;color:var(--muted);margin-top:3px}.dot{width:8px;height:8px;border-radius:50%;background:#727b8b}.dot.ok{background:#57d6a5}.dot.bad{background:#ff6b6b}.dot.checking{background:#f1c75b}
.center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.center.hidden{display:none}.center-card{text-align:center;padding:18px 22px;border:1px solid rgba(255,255,255,.07);border-radius:18px;background:rgba(5,8,12,.38);backdrop-filter:blur(10px)}.center-card .icon{font-size:38px}
.status{position:absolute;right:12px;bottom:12px;z-index:18;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(5,8,12,.5);font-size:10px;color:var(--muted)}.status.ok{color:var(--accent)}.status.bad{color:var(--danger)}
.now{position:absolute;left:12px;bottom:12px;z-index:18;max-width:60%;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:rgba(5,8,12,.5);backdrop-filter:blur(12px)}.now.hidden{display:none}.now strong{display:block;font-size:12px}.now span{font-size:10px;color:var(--muted)}
.loading{padding:18px;text-align:center;color:var(--muted);font-size:12px}.scrim{position:absolute;inset:0;background:rgba(0,0,0,.18);z-index:25}.scrim.hidden{display:none}
@media(max-width:700px){.drawer{top:98px}.brand small{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="player-shell"><video id="video" controls playsinline></video><div class="glow"></div><div id="center" class="center"><div class="center-card"><div class="icon">🌍</div><strong>All-World TV</strong><div style="margin-top:5px;font-size:12px;color:#a9b3c2">Избери държава и канал</div></div></div></div>
  <div class="topbar"><div class="brand-stack"><div class="brand"><div class="mark">AW</div><div><h1>All-World TV</h1><small>Live channels from around the world</small></div></div><button id="menu" class="menu">☰ Канали</button></div></div>
  <div id="scrim" class="scrim"></div>
  <aside id="drawer" class="drawer"><div class="drawer-head"><div class="drawer-title"><strong>Канали по държави</strong><span id="count" class="count">Зареждане…</span></div><div class="controls"><select id="country" class="control"><option value="">Всички държави</option></select><input id="search" class="control" type="search" placeholder="Търси канал..." autocomplete="off"></div></div><div id="list" class="list"><div class="loading">Зареждам плейлиста…</div></div></aside>
  <div id="now" class="now hidden"><strong id="nowTitle"></strong><span id="nowCountry"></span></div><div id="status" class="status">Готов</div>
</div>
<script>
const PLAYLIST='https://iptv-org.github.io/iptv/index.country.m3u';
const video=document.getElementById('video'),drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim'),menu=document.getElementById('menu'),country=document.getElementById('country'),search=document.getElementById('search'),list=document.getElementById('list'),count=document.getElementById('count'),center=document.getElementById('center'),status=document.getElementById('status'),now=document.getElementById('now'),nowTitle=document.getElementById('nowTitle'),nowCountry=document.getElementById('nowCountry');
let channels=[],filtered=[],hls=null,active=null;
function setDrawer(open){drawer.classList.toggle('closed',!open);scrim.classList.toggle('hidden',!open)}
menu.onclick=()=>setDrawer(drawer.classList.contains('closed'));scrim.onclick=()=>setDrawer(false);
function attrs(line){const out={};const re=/([\w-]+)="([^"]*)"/g;let m;while((m=re.exec(line))!==null)out[m[1]]=m[2];return out}
function parseM3U(text){const lines=text.split(/\r?\n/);const result=[];let meta=null;for(const raw of lines){const line=raw.trim();if(!line)continue;if(line.startsWith('#EXTINF:')){const a=attrs(line),comma=line.indexOf(',');meta={name:comma>=0?line.slice(comma+1).trim():(a['tvg-name']||'Без име'),logo:a['tvg-logo']||'',id:a['tvg-id']||'',country:a['group-title']||'Неизвестна държава'}}else if(!line.startsWith('#')&&meta){result.push({...meta,url:line});meta=null}}return result}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function buildCountries(){const arr=[...new Set(channels.map(c=>c.country).filter(Boolean))].sort((a,b)=>a.localeCompare(b));country.innerHTML='<option value="">Всички държави</option>'+arr.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('')}
function apply(){const q=search.value.trim().toLowerCase(),ct=country.value;filtered=channels.filter(ch=>(!ct||ch.country===ct)&&(!q||(`${ch.name} ${ch.country} ${ch.id}`).toLowerCase().includes(q)));count.textContent=filtered.length.toLocaleString('bg-BG')+' канала';render()}
function render(){if(!filtered.length){list.innerHTML='<div class="loading">Няма намерени канали.</div>';return}const frag=document.createDocumentFragment();for(const ch of filtered){const b=document.createElement('button');b.className='channel';b.innerHTML='<span class="dot"></span>'+(ch.logo?'<img class="logo" src="'+esc(ch.logo)+'" alt="" loading="lazy">':'<div class="fallback">TV</div>')+'<div><div class="name">'+esc(ch.name)+'</div><div class="country">'+esc(ch.country)+'</div></div>';b.onclick=()=>{if(active)active.classList.remove('active');active=b;b.classList.add('active');play(ch);setTimeout(()=>setDrawer(false),250)};frag.appendChild(b)}list.replaceChildren(frag)}
function setStatus(t,type=''){status.textContent=t;status.className='status'+(type?' '+type:'')}
function destroy(){if(hls){hls.destroy();hls=null}}
function play(ch){destroy();video.pause();video.removeAttribute('src');video.load();center.classList.add('hidden');now.classList.remove('hidden');nowTitle.textContent=ch.name;nowCountry.textContent=ch.country;setStatus('Свързване…');const isHls=/\.m3u8($|\?)/i.test(ch.url);if(isHls&&window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,lowLatencyMode:true,backBufferLength:30});hls.loadSource(ch.url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>{setStatus('Готов','ok');video.play().catch(()=>setStatus('Натисни Play','ok'))});hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)setStatus('Потокът е недостъпен','bad')})}else{video.src=ch.url;video.play().then(()=>setStatus('Възпроизвежда','ok')).catch(()=>setStatus('Натисни Play или потокът е недостъпен','bad'))}}
video.onplaying=()=>setStatus('Възпроизвежда','ok');video.onwaiting=()=>setStatus('Буфериране…');video.onerror=()=>setStatus('Грешка при потока','bad');country.onchange=apply;search.oninput=apply;
(async()=>{try{setStatus('Зареждане на каталога…');const r=await fetch(PLAYLIST,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);channels=parseM3U(await r.text());buildCountries();apply();setStatus('Готов','ok')}catch(e){console.error(e);count.textContent='Грешка';list.innerHTML='<div class="loading">Каталогът не се зареди.</div>';setStatus('Каталогът не се зареди','bad')}})();
</script>
</body></html>
