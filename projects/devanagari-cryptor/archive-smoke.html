<!doctype html><html><head><meta charset="utf-8"><title>Devanagari Archiver Smoke Test</title></head><body>
<h1>Archive mode browser integration test</h1>
<pre id="result">STARTED</pre>
<iframe id="app" style="display:none"></iframe>
<script>
"use strict";
const out=document.getElementById("result"),steps=[],frame=document.getElementById("app");
let complete=false;
function step(s){steps.push(s);out.textContent="STAGE: "+steps.join(" | ");}
function pass(s){complete=true;out.textContent="PASS: "+steps.join("; ")+"; "+s;}
function fail(s){complete=true;out.textContent="FAIL: "+String(s)+"\nCompleted: "+steps.join("; ");}
window.addEventListener("error", e=>{step("parent error "+(e.message||e.error));});
window.addEventListener("unhandledrejection",e=>{step("parent rejection "+e.reason);});
function assert(x,m){if(!x)throw Error(m);}
setTimeout(()=>{if(!complete)fail("WATCHDOG timeout at "+steps.join("; "));},75000);
frame.addEventListener("load",async()=>{
 step("iframe loaded");
 try{
  const w=frame.contentWindow;
  w.addEventListener("error",e=>step("iframe error "+e.message));
  w.addEventListener("unhandledrejection",e=>step("iframe rejection "+String(e.reason)));
  assert(w.document.querySelectorAll(".mode-tab").length===4,"four mode tabs missing");step("four tabs");
  for(const theme of ["dark","sand","blue","graphite"])assert(w.document.querySelector('option[value="'+theme+'"]'),"missing "+theme);
  step("four themes");
  step("native engine import");
  const native=await import("./archive-vendor/libarchive.js");
  native.Archive.init({workerUrl:"./archive-vendor/worker-bundle.js"});
  const nativeBytes=new TextEncoder().encode("Hello!");
  const nativeFile=new w.File([nativeBytes],"hello.txt");
  step("NATIVE WRITE ZIP");
  const nativeZip=await native.Archive.write({files:[{file:nativeFile,pathname:"hello.txt"}],outputFileName:"smoke.zip",compression:native.ArchiveCompression.NONE,format:native.ArchiveFormat.ZIP,passphrase:null});
  step("NATIVE ZIP BYTES "+nativeZip.size);
  const mod=await w.DC_ARCHIVE_ENGINE.load();step("loader resolved");
  const oldGet=mod.Archive._options.getWorker;
  mod.Archive._options.getWorker=function(){
    step("new worker started");
    const worker=oldGet();
    worker.addEventListener("error",function(e){step("WORKER ERROR: "+e.message+" filename="+e.filename+" line="+e.lineno);});
    worker.addEventListener("messageerror",function(e){step("WORKER MESSAGEERROR: "+e);});
    return worker;
  };
  const bytes=new TextEncoder().encode("Hello text example! नमस्ते абв\n".repeat(18));
  const file=new w.File([bytes],"unicode-данни.txt",{type:"text/plain"});
  async function roundtrip(format,compression,ext){
   step("WRITE "+format);
   const output=await mod.Archive.write({files:[{file,pathname:"folder/unicode-данни.txt"}],outputFileName:"test."+ext,format:mod.ArchiveFormat[format],compression:mod.ArchiveCompression[compression],passphrase:null});
   assert(output.size>0,"archive empty "+format);
   step("OPEN "+format+" "+output.size+"B");
   const archive=await mod.Archive.open(output);
   try {
     const files=await archive.getFilesArray();
     const found=files.find(x=>x.file&&typeof x.file.extract==="function");
     assert(found,format+" no file");
     step("EXTRACT "+format);
     const plain=new Uint8Array(await (await found.file.extract()).arrayBuffer());
     assert(plain.length===bytes.length,format+" length mismatch");
     assert(plain.every((v,i)=>v===bytes[i]),format+" contents mismatch");
     step("ROUNDTRIP "+format);
   }finally{try{await archive.close();}catch(e){}}
  }
  await roundtrip("ZIP","NONE","zip");
  await roundtrip("USTAR","NONE","tar");
  await roundtrip("PAX","GZIP","tar.gz");
  await roundtrip("SEVEN_ZIP","NONE","7z");
  pass("all four archive roundtrips");
 }catch(e){fail(e?.stack||e);}
});
step("assigning iframe src");frame.src="./app-4.3.10-standalone.html";
</script></body></html>
