<!doctype html><html><head><meta charset="utf-8"><title>Devanagari 4.3.11 verified archiver tests</title></head><body>
<pre id="result">RUNNING</pre><iframe id="app" src="./app-4.3.11-standalone.html" style="display:none"></iframe>
<script>
"use strict";
const out=document.getElementById("result"),frame=document.getElementById("app"),log=[];
function assert(cond,msg){if(!cond)throw Error(msg);}
function stage(msg){log.push(msg);out.textContent="STAGE: "+log.join(" | ");}
function fail(msg){out.textContent="FAIL: "+String(msg)+"\n"+log.join("; ");}
async function waitFor(fn,ms=9000){const start=Date.now();while(Date.now()-start<ms){if(fn())return;await new Promise(r=>setTimeout(r,50));}throw Error("UI timed out: "+log.join("; "));}
frame.addEventListener("load",async()=>{
 try{
 const w=frame.contentWindow,d=w.document,core=w.DC_ARCHIVE_CORE;
 assert(d.querySelectorAll(".mode-tab").length===4,"four tabs");stage("four tabs");
 for(const theme of ["dark","sand","blue","graphite"])assert(d.querySelector('option[value="'+theme+'"]'),"theme "+theme);
 stage("four themes");
 assert(core&&core.zipWrite&&core.gzipOpen,"core not loaded");stage("offline core present");
 const text=new TextEncoder().encode("Devanagari नमस्ते България! \n".repeat(20));
 const binary=new Uint8Array([0,1,2,3,4,255]);
 const files=[{file:new w.File([text],"документ.txt"),pathname:"nested/документ.txt"},{file:new w.File([binary],"bytes.bin"),pathname:"bytes.bin"}];
 for(const format of ["zip","tar","tgz","gz"]){
  stage("begin "+format);
  let output,arc;
  if(format==="zip"){output=await core.zipWrite(files,"demo.zip");arc=await core.zipOpen(output);}
  else if(format==="tar"){output=await core.tarWrite(files,"demo.tar",false);arc=await core.tarOpen(output,false);}
  else if(format==="tgz"){output=await core.tarWrite(files,"demo.tar.gz",true);arc=await core.tarOpen(output,true);}
  else{output=await core.gzipWrite(files.slice(0,1),"документ.txt.gz");arc=await core.gzipOpen(output);}
  assert(arc.entries.length===(format==="gz"?1:2),format+" entry count");
  for(let i=0;i<arc.entries.length;i++){
   const result=new Uint8Array(await (await arc.entries[i].extract()).arrayBuffer());
   const original=new Uint8Array(await files[i].file.arrayBuffer());
   assert(result.length===original.length&&result.every((b,j)=>b===original[j]),format+" content mismatch");
  }
  stage(format+" roundtrip");
 }
 d.querySelector('[data-mode="archive"]').click();
 assert(!d.getElementById("archiveSection").hidden,"archive mode hidden");
 assert(d.getElementById("textSection").hidden&&d.getElementById("fileSection").hidden,"original modes visible");
 stage("fourth tab UI");
 const src=files[0].file,transfer=new w.DataTransfer();transfer.items.add(src);
 const choose=d.getElementById("arcFiles");choose.files=transfer.files;choose.dispatchEvent(new w.Event("change",{bubbles:true}));
 d.getElementById("arcFormat").value="zip";
 const captures=[];
 w.download=(blob,name)=>{captures.push({blob,name});};
 d.getElementById("arcCreate").click();
 await waitFor(()=>captures.length>0||d.getElementById("arcStatus").classList.contains("archive-error"));
 assert(captures.length===1,"UI create: "+d.getElementById("arcStatus").textContent);
 assert(captures[0].name.endsWith(".zip"),"filename did not end with ZIP");
 stage("UI created ZIP");
 const zipFile=new w.File([captures[0].blob],"test.zip");
 const tr2=new w.DataTransfer();tr2.items.add(zipFile);
 const archiveInput=d.getElementById("arcSource");archiveInput.files=tr2.files;archiveInput.dispatchEvent(new w.Event("change",{bubbles:true}));
 d.getElementById("arcPreview").click();
 await waitFor(()=>d.querySelectorAll("#arcContent input[type=checkbox]").length>0||d.getElementById("arcStatus").classList.contains("archive-error"));
 assert(d.querySelectorAll("#arcContent input[type=checkbox]").length===1,"preview error: "+d.getElementById("arcStatus").textContent);
 stage("UI archive preview");
 d.getElementById("arcExtract").click();
 await waitFor(()=>captures.length===2||d.getElementById("arcStatus").classList.contains("archive-error"));
 assert(captures.length===2,"extraction error: "+d.getElementById("arcStatus").textContent);
 const restored=new Uint8Array(await captures[1].blob.arrayBuffer());
 assert(restored.length===text.length&&restored.every((v,i)=>v===text[i]),"UI extraction bytes changed");
 stage("UI extracted identical bytes");
 out.textContent="PASS: "+log.join("; ");
 }catch(e){fail(e?.stack||e);}
});
setTimeout(()=>{if(!out.textContent.startsWith("PASS:")&&!out.textContent.startsWith("FAIL:"))fail("test timeout");},50000);
</script></body></html>
